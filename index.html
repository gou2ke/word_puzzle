/* DOM 引用 */
const $ = id => document.getElementById(id);
const mapEl = $('map'), playerEl = document.createElement('div');
const narrativeText = $('narrative-text'), objectiveText = $('objective-text');
const dialogEl = $('dialog'), bagPanel = $('bag-panel'), bagBtn = $('bag-btn');

/* ============================================================
   五、工具函数
   ============================================================ */
const key = (x, y) => x + ',' + y;
const entityAt = (x, y) => state.entities.get(key(x, y));

function setPos(el, gx, gy) {
  el.style.setProperty('--tx', (gx * CELL) + 'px');
  el.style.setProperty('--ty', (gy * CELL) + 'px');
}

/* 动画计时器：切关时统一清掉，避免旧关卡的延时回调污染新关卡 */
const timers = new Set();
function later(fn, ms) {
  const id = setTimeout(() => { timers.delete(id); fn(); }, ms);
  timers.add(id);
  return id;
}
function clearTimers() {
  timers.forEach(clearTimeout);
  timers.clear();
}

/* 打字机叙述 */
let typeTimer = null;
function narrate(text) {
  clearInterval(typeTimer);
  narrativeText.textContent = '';
  let i = 0;
  typeTimer = setInterval(() => {
    i++;
    narrativeText.textContent = text.slice(0, i);
    if (i >= text.length) clearInterval(typeTimer);
  }, 32);
}

/* 简易音效（Web Audio 合成，无外部资源） */
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function tone(freq, dur = .08, type = 'sine', gain = .04, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  move:      () => tone(180, .05, 'triangle', .028),
  bump:      () => tone(92,  .09, 'sawtooth', .032),
  pickup:    () => { tone(520, .07, 'sine', .05); tone(784, .12, 'sine', .05, .07); },
  dismantle: () => { tone(300, .12, 'triangle', .05); tone(430, .12, 'triangle', .05, .13); tone(650, .2, 'triangle', .05, .26); },
  combine:   () => { tone(240, .1, 'sine', .05); tone(360, .14, 'sine', .05, .09); tone(540, .22, 'sine', .05, .18); },
  open:      () => tone(440, .05, 'sine', .03),
  strike:    n => { tone(280 + n * 100, .07, 'square', .035); tone(1000, .05, 'sine', .02, .05); },
  fire:      () => { tone(150, .32, 'sawtooth', .03); tone(320, .2, 'sine', .025, .06); },
};

/* ============================================================
   六、关卡装载
   ============================================================ */
function buildMap() {
  const MAP = state.level.map;
  ROWS = MAP.length;
  COLS = MAP[0].length;
  const crackedSet = new Set((state.level.cracked || []).map(c => key(c.x, c.y)));

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const ch = MAP[y][x];
      if (ch === '.') continue;
      if (ch === '我') { state.player.x = x; state.player.y = y; continue; }

      const def = CHARS[ch] || { kind: 'scene', solid: true };
      const el = document.createElement('div');
      el.className = 'cell-char ' +
        (def.kind === 'scene' ? (def.grass ? 'grass' : 'scene') : (def.chain ? 'chain' : 'entity')) +
        (def.cls ? ' ' + def.cls : '');
      const skin = state.level.skin && state.level.skin[ch];   // 关卡专属配色
      if (skin) el.classList.add(skin);
      el.textContent = ch;
      setPos(el, x, y);
      mapEl.appendChild(el);
      const ent = { char: ch, x, y, kind: def.kind, solid: def.solid, def, el };
      if (def.mirror) {   // 镜子：这一关开局可能蒙着雾
        ent.fogged = !!state.level.mirrorFogged;
        if (ent.fogged) el.classList.add('mirror-fogged');
      }
      if (crackedSet.has(key(x, y))) {   // 带裂缝的墙：钻头唯一能钻开的地方
        ent.cracked = true;
        el.classList.add('wall-cracked');
      }
      state.entities.set(key(x, y), ent);

      if (def.chain) state.leash = { x1: x, y1: y, x2: x + 1, y2: y + 1 };   // 链为左上角的 2×2 牢笼
    }
  }

  playerEl.id = 'player';
  playerEl.className = 'cell-char';
  playerEl.style.transition = 'transform .13s ease-out';
  playerEl.innerHTML = '我<span id="held-char"></span>';
  setPos(playerEl, state.player.x, state.player.y);
  mapEl.appendChild(playerEl);
}

function renderLeash() {
  mapEl.querySelectorAll('.range-tile').forEach(t => t.remove());
  if (!state.leash) return;
  const L = state.leash;
  for (let gy = Math.max(1, L.y1); gy <= Math.min(ROWS - 2, L.y2); gy++) {
    for (let gx = Math.max(1, L.x1); gx <= Math.min(COLS - 2, L.x2); gx++) {
      const t = document.createElement('div');
      t.className = 'range-tile';
      setPos(t, gx, gy);
      mapEl.appendChild(t);
    }
  }
}

/* ---------- 视野：进房全黑，主角做出任意行动后自他为中心散开 ---------- */
let visionRaf = null;

function resetVision() {
  cancelAnimationFrame(visionRaf);
  const v = $('vision'), lw = $('leash-vision');
  v.classList.remove('clear');
  v.style.setProperty('--vx', ((state.player.x + .5) * CELL) + 'px');
  v.style.setProperty('--vy', ((state.player.y + .5) * CELL) + 'px');
  v.style.setProperty('--vr', '1px');
  state.visionOpened = false;

  if (state.leash) {
    /* 被链拴住：改用矩形视野窗，先缩成主角身上的一点 */
    v.style.display = 'none';
    lw.style.transition = 'none';
    lw.style.display = 'block';
    lw.style.opacity = '1';
    lw.style.left = ((state.player.x + .5) * CELL - 1) + 'px';
    lw.style.top = ((state.player.y + .5) * CELL - 1) + 'px';
    lw.style.width = '2px';
    lw.style.height = '2px';
    void lw.offsetWidth;      // 让初始位置立即生效，再恢复过渡
    lw.style.transition = '';
  } else {
    v.style.display = 'block';
    lw.style.display = 'none';
  }
}

function openVision() {
  if (!state.level || state.visionOpened) return;
  state.visionOpened = true;

  /* 链还在：视野只散开到活动范围那四格 */
  if (state.leash) {
    const L = state.leash, lw = $('leash-vision');
    lw.style.left = (L.x1 * CELL) + 'px';
    lw.style.top = (L.y1 * CELL) + 'px';
    lw.style.width = ((L.x2 - L.x1 + 1) * CELL) + 'px';
    lw.style.height = ((L.y2 - L.y1 + 1) * CELL) + 'px';
    return;
  }

  const v = $('vision');
  v.style.setProperty('--vx', ((state.player.x + .5) * CELL) + 'px');
  v.style.setProperty('--vy', ((state.player.y + .5) * CELL) + 'px');

  const maxR = Math.hypot(COLS * CELL, ROWS * CELL) * 1.05;
  const t0 = performance.now(), dur = 560;
  const tick = now => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);   // 先快后慢
    v.style.setProperty('--vr', (maxR * e).toFixed(1) + 'px');
    if (p < 1) visionRaf = requestAnimationFrame(tick);
    else v.classList.add('clear');
  };
  visionRaf = requestAnimationFrame(tick);
}

/* 链断：视野窗从活动范围扩到整间屋子，随后撤掉黑幕 */
function expandVisionToRoom() {
  const lw = $('leash-vision');
  if (lw.style.display === 'none') return;
  lw.style.left = '0px';
  lw.style.top = '0px';
  lw.style.width = (COLS * CELL) + 'px';
  lw.style.height = (ROWS * CELL) + 'px';
  later(() => {
    lw.style.opacity = '0';
    later(() => { lw.style.display = 'none'; }, 320);
  }, 560);
}

function loadLevel(i) {
  clearTimers();
  clearInterval(typeTimer);
  document.querySelectorAll('.fly-char').forEach(el => el.remove());
  mapEl.querySelectorAll('.sound-fly').forEach(el => el.remove());
  $('overlay').classList.remove('show');
  $('death-overlay').classList.remove('show');
  $('mirror-overlay').classList.remove('show');
  $('ending-overlay').classList.remove('show');
  $('dis-stage').querySelectorAll('.dis-part').forEach(p => p.remove());
  closeDialog();

  const lv = LEVELS[i];
  state.levelIndex = i;
  state.level = lv;
  state.player = { x: 0, y: 0, held: null, facing: { dx: 0, dy: 1 } };
  state.entities = new Map();
  state.bag = [];
  state.leash = null;
  state.flags = {};
  state.step = 0;
  state.moveCount = 0;
  state.animating = false;
  state.skipAnim = null;
  state.dead = false;
  state.fireSpreading = false;
  state.waterCells = new Set();
  state.mirrorOpen = false;
  state.mirrorBusy = false;
  state.mirrorEl = null;
  cancelMirrorMorph();
  state.ending = false;

  mapEl.querySelectorAll('.cell-char, .range-tile').forEach(el => el.remove());
  renderLevelSelect();

  buildMap();
  resetVision();
  renderLeash();
  renderBag();

  if (lv.steps) {
    setStep(0);
  } else {
    objectiveText.textContent = lv.title || lv.name || '';
    narrate(lv.intro || '');
  }
}

let switching = false;
function gotoLevel(i) {
  if (switching) return;
  if (i >= LEVELS.length) { showEnding(); return; }   // 最后一扇门后，没有下一关
  switching = true;
  const fade = $('fade');
  fade.classList.add('show');
  setTimeout(() => {
    loadLevel(i);
    fade.classList.remove('show');
    switching = false;
  }, 430);
}

/* 左上角选关 */
function renderLevelSelect() {
  const box = $('level-select');
  box.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.className = 'lvl-btn' + (i === state.levelIndex ? ' active' : '');
    b.textContent = lv.short;
    b.onclick = () => {
      initAudio();
      if (i !== state.levelIndex) gotoLevel(i);
    };
    box.appendChild(b);
  });
}

/* ============================================================
   七、引导步骤（软引导：允许超前完成，到达时自动跳过）
   ============================================================ */
function completeStep(stepKey) {
  const steps = state.level && state.level.steps;
  if (!steps) return;
  const idx = steps.findIndex(s => s.key === stepKey);
  if (idx < 0) return;
  if (steps[idx].flag) state.flags[steps[idx].flag] = true;
  if (state.step === idx) setStep(idx + 1);
}

function setStep(i) {
  const steps = state.level.steps;
  while (i < steps.length - 1 && steps[i].flag && state.flags[steps[i].flag]) i++;
  state.step = Math.min(i, steps.length - 1);
  const s = steps[state.step];
  objectiveText.textContent = s.objective;
  const bar = $('objective-bar');
  bar.classList.remove('flash'); void bar.offsetWidth; bar.classList.add('flash');
  /* enter 可以是单句，也可以是一组分段的句子：逐句显示，等上一句打完再停一会儿 */
  const sayLines = lines => {
    if (!lines.length) return;
    const [head, ...rest] = lines;
    narrate(head);
    if (rest.length) later(() => sayLines(rest), head.length * 32 + 2000);
  };
  sayLines(Array.isArray(s.enter) ? s.enter : [s.enter]);
  if (s.spawn) spawnStepEntity(s.spawn);
}

/* 步骤触发的场景变化（例如教程结束时墙上裂出一道门） */
function spawnStepEntity(cfg) {
  const f = 'spawned:' + cfg.char;
  if (state.flags[f]) return;
  state.flags[f] = true;

  const old = entityAt(cfg.x, cfg.y);
  if (old) removeEntity(old);          // 覆盖墙体
  const ent = spawnCharEntity(cfg.char, cfg.x, cfg.y);
  popIn(ent, cfg.x, cfg.y);
  sfx.combine();
}

/* ============================================================
   八、移动与撞击
   ============================================================ */
function tryMove(dx, dy) {
  if (state.animating || state.dialogFor) return;
  state.player.facing = { dx, dy };   // 记住朝向，放下时优先放在身前
  const nx = state.player.x + dx, ny = state.player.y + dy;
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return;

  /* 链的限制：超出活动矩形，空气墙 */
  if (state.leash) {
    const L = state.leash;
    if (nx < L.x1 || nx > L.x2 || ny < L.y1 || ny > L.y2) {
      bumpFx(dx, dy, null);
      if (!state.flags.leashHinted) {
        state.flags.leashHinted = true;
        narrate(NARR.leash);
      }
      return;
    }
  }

  const target = entityAt(nx, ny);
  if (target) {
    if (!target.solid) {            // 可穿过的字（草、灭）
      movePlayer(nx, ny, target);
      return;
    }
    bumpFx(dx, dy, target);

    /* 手持物配方优先：墙也会对“斧”有反应 */
    const held = state.player.held;
    if (held && target.def.combine && target.def.combine[held]) {
      const res = target.def.combine[held];
      if (typeof res === 'string') combineChars(held, target, res);
      else if (res.action === 'break') breakWithAxe(target, res);
      else if (res.action === 'ignite') igniteWood(held, target, res);
      else if (res.action === 'melt') meltIce(held, target);
      else if (res.action === 'axeWall') axeWall(target);
      else if (res.action === 'drillWood') drillWood(target);
      return;
    }

    /* 钻头只认带裂缝的墙；普通墙撞上去什么也不会发生，也不提醒 */
    if (held === '钻' && target.char === '墙') {
      if (target.cracked) drillWall(target);
      return;
    }

    /* 冰：撞上去先听见一声；手持“钻”会被劝住，改走温和的化冰方式。
       “日”只晒得化镜上的薄雾，晒不穿墙角这块厚冰——要更烈的热 */
    if (target.char === '冰') {
      if (held === '日') narrate('日头贴上去，冰面只亮了一亮——这块冰厚得晒不穿，得用更烈的热。');
      else narrate(held === '钻'
        ? '这样似乎会破坏冰里的东西，还是采取更温和的方式吧。'
        : '冰里似乎有什么东西……');
      return;
    }

    if (target.kind === 'scene') { onBumpScene(target); return; }
    if (target.def.mirror) { useMirror(target); return; }
    if (target.def.portal) {
      if (state.level.doorLock) {
        if (state.player.held === '开') openDoorAndEnd();
        else narrate('门锁着。门板上浮着一个淡淡的“关”字——还差一把“开”。');
        return;
      }
      gotoLevel(state.levelIndex + 1);
      return;
    }

    /* 可交互实体：击打 > 合体 > 火 > 对话框 */
    if (held && target.def.strike && target.def.strike.with === held) {
      strikeEntity(target);
      return;
    }
    if (held && tryAssemble(held, target)) return;
    if (target.def.hot) {
      narrate(held ? NARR.hotHeld(held) : NARR.hot);
      return;
    }
    openDialog(target);
    return;
  }
  movePlayer(nx, ny, null);
}

function movePlayer(nx, ny, underEntity) {
  state.player.x = nx; state.player.y = ny;
  setPos(playerEl, nx, ny);
  sfx.move();
  state.moveCount++;
  if (state.moveCount >= 4) completeStep('move');

  if (underEntity) {
    if (underEntity.def.grass) {
      underEntity.el.classList.remove('rustle');
      void underEntity.el.offsetWidth;
      underEntity.el.classList.add('rustle');
    }
    if (underEntity.char === '灭') completeStep('pass');   // 穿过灭
  }

  /* 钻开的“洞”：走下去，就是下一间屋子 */
  if (underEntity && underEntity.char === '洞' && state.level.holeExit !== undefined) {
    gotoLevel(state.level.holeExit);
    return;
  }

  /* 左下角：带着“听”才听得见；空着手，只有一片听不见的动静。
     已经用“听”听见过一次之后，这句话就再也不提了。 */
  if (state.level.sound && nx === 1 && ny === ROWS - 2) {
    if (state.player.held === '听') amplifyHearing();
    else if (!state.flags.heard) {
      const now = Date.now();
      if (now - (state.flags.cornerHintAt || 0) > 4000) {   // 反复进出不刷屏
        state.flags.cornerHintAt = now;
        narrate('……墙里明明有声音，我却什么也听不清。');
      }
    }
  }

  /* 那句话里的“我”：主角亲自站进那个空位 */
  if (state.flags.saySelfPos) {
    refreshSelfBlank();
    checkSayComplete(false);
  }
}

/* 撞击动画：主角顶一下 + 目标字抖动 */
function bumpFx(dx, dy, target) {
  sfx.bump();
  playerEl.style.transition = 'transform .05s';
  setPos(playerEl, state.player.x + dx * .16, state.player.y + dy * .16);
  later(() => {
    setPos(playerEl, state.player.x, state.player.y);
    later(() => playerEl.style.transition = 'transform .13s ease-out', 60);
  }, 60);
  if (target) {
    target.el.classList.remove('shake');
    void target.el.offsetWidth;
    target.el.classList.add('shake');
  }
}

function onBumpScene(target) {
  if (target.def && target.def.say) {   // 说出口的话：字字生根，搬不动
    if (!state.flags.sayBlockedHinted) {
      state.flags.sayBlockedHinted = true;
      narrate('这句话已经落在屋里，字字生根，挡在面前。');
    }
    return;
  }
  if (!state.flags.sceneExplained) {
    state.flags.sceneExplained = true;
    narrate(NARR.sceneFirst);
  }
  completeStep('bump');
}

/* ============================================================
   九、对话框（拆解 / 拾取 / 离开）
   ============================================================ */
function openDialog(entity) {
  state.dialogFor = entity;
  entity.el.classList.add('focus');
  $('dlg-char').textContent = entity.char;
  $('dlg-sub').textContent = entity.def.sub || '它在等你';

  const bDis = $('btn-dismantle'), bPick = $('btn-pickup');
  bDis.innerHTML = '拆解<span class="key">1</span>';
  bPick.innerHTML = '拾取<span class="key">2</span>';
  bDis.disabled = !entity.def.dismantle;
  bPick.disabled = !entity.def.pickable;
  if (bDis.disabled)  bDis.innerHTML  += `<span class="why">${entity.def.dismantleWhy || '拆无可拆'}</span>`;
  if (bPick.disabled) bPick.innerHTML += `<span class="why">${entity.def.pickableWhy || '拿不动'}</span>`;

  /* 弹出位置：实体右侧，贴边则换左侧 */
  dialogEl.style.display = 'block';
  const r = entity.el.getBoundingClientRect();
  const dw = dialogEl.offsetWidth, dh = dialogEl.offsetHeight;
  let x = r.right + 12;
  if (x + dw > innerWidth - 12) x = r.left - dw - 12;
  let y = r.top + r.height / 2 - dh / 2;
  y = Math.max(12, Math.min(y, innerHeight - dh - 12));
  dialogEl.style.left = x + 'px';
  dialogEl.style.top = y + 'px';

  if (!state.flags.entityExplained) {
    state.flags.entityExplained = true;
    narrate(NARR.entityFirst);
  }
}

function closeDialog() {
  if (state.dialogFor) state.dialogFor.el.classList.remove('focus');
  state.dialogFor = null;
  dialogEl.style.display = 'none';
}

/* ============================================================
   十、拾取：字平滑飞入背包
   ============================================================ */
function pickUp(entity) {
  closeDialog();
  state.animating = true;
  sfx.pickup();

  const slot = entity.saySlot, sx = entity.x, sy = entity.y;
  const from = entity.el.getBoundingClientRect();
  const to = bagBtn.getBoundingClientRect();
  removeEntity(entity);

  flyChar(entity.char,
    { x: from.left + from.width / 2, y: from.top + from.height / 2 },
    { x: to.left + to.width / 2, y: to.top + to.height / 2 },
    620, () => {
      state.bag.push(entity.char);
      renderBag();
      popBagBtn();
      state.animating = false;
      completeStep('pickup');
      if (slot) reopenSayBlank(slot, sx, sy);   // 取回填字，空位重新露出
    });
}

/* ============================================================
   十一、拆解：屏幕中央拆分，任意数量部件依次飞入背包
   ============================================================ */
function dismantle(entity) {
  closeDialog();
  state.animating = true;
  sfx.dismantle();

  const parts = entity.def.dismantle;
  removeEntity(entity);

  const overlay = $('overlay'), big = $('dis-big'), stage = $('dis-stage');
  stage.querySelectorAll('.dis-part').forEach(p => p.remove());
  big.textContent = entity.char;
  big.classList.remove('crack');
  big.style.opacity = 1; big.style.transform = 'scale(1)';
  overlay.classList.add('show');

  /* 这一轮拆解的计时器单独记下：跳过时只清它们，不动火、声音等其他计时 */
  const ids = [];
  const L = (fn, ms) => { const id = later(fn, ms); ids.push(id); return id; };
  const n = parts.length;
  const added = parts.map(() => false);
  let done = false;

  /* 任意键跳过：剩下的部件直接全部入包，立刻收尾 */
  const finish = () => {
    if (done) return;
    done = true;
    ids.forEach(id => { clearTimeout(id); timers.delete(id); });
    stage.querySelectorAll('.dis-part').forEach(p => p.remove());
    parts.forEach((c, i) => {
      if (!added[i]) { added[i] = true; state.bag.push(c); }
    });
    renderBag();
    popBagBtn();
    overlay.classList.remove('show');
    big.classList.remove('crack');
    state.skipAnim = null;
    state.animating = false;
    completeStep('dismantle');
  };
  state.skipAnim = finish;

  L(() => {
    /* 原字碎裂，部件现身并横向散开；把内联样式交还回去，.crack 的过渡才能让原字迅速暗淡 */
    big.style.opacity = '';
    big.style.transform = '';
    big.classList.add('crack');
    const partEls = parts.map((c, i) => {
      const p = document.createElement('span');
      p.className = 'dis-part';
      p.textContent = c;
      stage.appendChild(p);
      const off = i - (n - 1) / 2;
      const from = `translate(calc(-50% + ${off * .84}em), -50%)`;
      const to = `translate(calc(-50% + ${off * 2.4}em), -50%)`;
      p.style.opacity = 1;
      p.style.transform = from;
      p.animate([{ transform: from }, { transform: to }],
        { duration: 480, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' });
      return p;
    });

    /* 部件依次飞入背包 */
    L(() => {
      const b = bagBtn.getBoundingClientRect();
      const tp = { x: b.left + b.width / 2, y: b.top + b.height / 2 };
      partEls.forEach((p, i) => {
        const r = p.getBoundingClientRect();
        L(() => {
          p.style.visibility = 'hidden';   // 原部件隐去，由飞行克隆体接管
          flyChar(parts[i],
            { x: r.left + r.width / 2, y: r.top + r.height / 2 },
            tp, 640, () => {
              if (added[i]) return;        // 已经跳过收尾，就不再重复入包
              added[i] = true;
              state.bag.push(parts[i]);
              renderBag();
              popBagBtn();
            }, 72);
        }, i * 160);
      });
    }, 900);

    /* 收尾（自然播完时也走同一个 finish） */
    L(finish, 900 + n * 160 + 900);
  }, 950);
}

/* ============================================================
   十二、合成 / 破字 / 击打
   ============================================================ */
/* 手持字 + 实体字 → 新字（灭：失去碰撞箱） */
function combineChars(heldChar, target, resultChar) {
  state.animating = true;
  sfx.combine();

  const from = playerEl.getBoundingClientRect();
  const to = target.el.getBoundingClientRect();
  const idx = state.bag.indexOf(heldChar);
  if (idx >= 0) state.bag.splice(idx, 1);   // 手持物被消耗
  setHeld(null);

  flyChar(heldChar,
    { x: from.left + from.width / 2, y: from.top + from.height / 2 },
    { x: to.left + to.width / 2, y: to.top + to.height / 2 },
    420, () => {
      target.el.classList.add('flash');
      later(() => {
        target.char = resultChar;
        target.el.textContent = resultChar;
        target.solid = false;
        target.el.classList.remove('flash', 'entity');
        if (target.def.cls) target.el.classList.remove(target.def.cls);
        target.el.classList.add('dead');
        state.animating = false;
        completeStep('combine');
        if (target.fromMirror) {   // 镜前那团火终于熄了，镜面凉下来
          setMirrorHot(false);
          later(() => narrate('“一”压下去，“火”成了“灭”。镜面渐渐凉了，又能照出人了。'), 260);
        }
      }, 420);
    }, 22);
}

/* ---------- 合体：拆开的字一定能拼回去，但只产出真正的字 ----------
   把一块部件放在地上，手持另一块撞上去。
   配方必须精确命中；拼不成字的组合什么也不会发生，不留中间产物。 */
function tryAssemble(heldChar, target) {
  const sorted = [target.char, heldChar].sort().join('');
  const recipe = ASSEMBLIES.find(r => r.sorted === sorted);
  if (!recipe) return false;
  assemble(heldChar, target, recipe.result);
  return true;
}

function assemble(heldChar, target, resultChar) {
  state.animating = true;
  sfx.combine();

  const from = playerEl.getBoundingClientRect();
  const to = target.el.getBoundingClientRect();
  const idx = state.bag.indexOf(heldChar);
  if (idx >= 0) state.bag.splice(idx, 1);   // 手持部件被用掉
  setHeld(null);

  const tx = target.x, ty = target.y;
  const targetChar = target.char;

  flyChar(heldChar,
    { x: from.left + from.width / 2, y: from.top + from.height / 2 },
    { x: to.left + to.width / 2, y: to.top + to.height / 2 },
    420, () => {
      target.el.classList.add('flash');
      later(() => {
        removeEntity(target);
        const ent = spawnCharEntity(resultChar, tx, ty);
        popIn(ent, tx, ty);
        /* 若合出来的正是句子缺的那个字，直接让它落进空位，不必再拾取放下 */
        later(() => {
          if (state.entities.get(key(ent.x, ent.y)) !== ent) return;   // 已被玩家拾走
          if (!checkSayAnswer(resultChar, ent)) {
            narrate(`“${heldChar}”与“${targetChar}”合拢——“${resultChar}”成形了。`);
          }
        }, 420);
        /* 引导：合体完成后再推进（让“门”在日月合成之后才出现） */
        later(() => completeStep('rejoin'), 800);
        state.animating = false;
      }, 380);
    }, 22);
}

/* 斧劈万物：目标碎成 res.parts 入包，斧飞回手上；res.release 时解除链的限制 */
function breakWithAxe(target, res) {
  state.animating = true;
  sfx.combine();

  const P = r => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
  const from = playerEl.getBoundingClientRect();
  const to = target.el.getBoundingClientRect();

  flyChar('斧', P(from), P(to), 380, () => {
    target.el.classList.add('flash');
    sfx.bump();
    later(() => {
      removeEntity(target);
      if (res.release) {
        state.leash = null;
        renderLeash();
        expandVisionToRoom();   // 链断，视野放开到整间屋子
      }
      sfx.dismantle();

      const tp = P(bagBtn.getBoundingClientRect());
      res.parts.forEach((c, i) => {
        later(() => {
          flyChar(c, P(to), tp, 620, () => {
            state.bag.push(c); renderBag(); popBagBtn();
          }, 30);
        }, i * 150);
      });

      later(() => {
        flyChar('斧', P(to), P(playerEl.getBoundingClientRect()), 380, () => {
          setHeld('斧');
          state.animating = false;
          narrate(res.narr);
        }, 22);
      }, 320);
    }, 380);
  }, 22);
}

/* 木凑进火里：木被点燃，还是那块“木”，只是烧红了 */
function igniteWood(heldChar, target) {
  if (state.flags.litWood) { narrate('“木”已经烧着了，火苗正旺。'); return; }
  if (state.flags.ashWood) { narrate('“木”被冰水浸透了。'); return; }
  state.animating = true;
  sfx.fire();

  const P = r => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
  const from = P(playerEl.getBoundingClientRect());
  const to = P(target.el.getBoundingClientRect());

  setHeld(null);   // 木暂时离手，点燃后原样飞回
  flyChar(heldChar, from, to, 360, () => {
    target.el.classList.add('flash');
    later(() => {
      target.el.classList.remove('flash');
      state.flags.litWood = true;
      flyChar(heldChar, to, P(playerEl.getBoundingClientRect()), 380, () => {
        setHeld(heldChar);
        state.animating = false;
        narrate('“木”伸进火里，噼啪一声——它烧起来了。');
      }, 26);
    }, 380);
  }, 22);
}

/* 钻木取火：手持“钻”撞向地上的“木”，钻头飞转带出火星，木燃成一团“火”。
   与斧击石生出的火完全一样——20 秒内不灭，照样会蔓延。 */
function drillWood(target) {
  if (state.animating) return;
  state.animating = true;
  sfx.combine();

  const P = r => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
  const from = P(playerEl.getBoundingClientRect());
  const to = P(target.el.getBoundingClientRect());
  const tx = target.x, ty = target.y;

  flyChar('钻', from, to, 360, () => {
    target.el.classList.add('flash');
    sfx.fire();
    later(() => {
      removeEntity(target);
      spawnFire(tx, ty, '火');
      flyChar('钻', to, P(playerEl.getBoundingClientRect()), 360, () => {
        state.animating = false;
        narrate('“钻”抵住“木”，飞旋、发热——一星红亮从木屑里蹦出来，整块“木”烧成了一团“火”。');
      }, 22);
    }, 420);
  }, 22);
}

/* 烧着的木贴上冰：冰塌成一摊水（无实体背景），水里浮出一个“口”，
   左下的墙里渗出一声“声”；木被浇灭，还是那块木，不消失。 */
function meltIce(heldChar, target) {
  if (!state.flags.litWood) { narrate('一块冷木贴上去，冰纹丝不动。'); return; }
  state.animating = true;
  sfx.fire();

  const P = r => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
  const from = P(playerEl.getBoundingClientRect());
  const to = P(target.el.getBoundingClientRect());
  const tx = target.x, ty = target.y;

  setHeld(null);
  flyChar(heldChar, from, to, 380, () => {
    target.el.classList.add('flash');
    later(() => {
      removeEntity(target);
      spawnWater(tx, ty);
      /* “口”浮在冰的左边；左边被占就继续往左找，实在没有才退回水里 */
      const taken = (x, y) => !!entityAt(x, y) || (state.player.x === x && state.player.y === y);
      let kx = tx;
      for (let x = tx - 1; x >= 1; x--) {
        if (!taken(x, ty)) { kx = x; break; }
      }
      const released = state.level.iceRelease || '口';
      const bonus = spawnCharEntity(released, kx, ty);
      popIn(bonus, kx, ty);
      /* 冰把火浇灭了：木还是那块木，只是浸成了灰色 */
      state.flags.litWood = false;
      state.flags.ashWood = true;
      flyChar(heldChar, to, P(playerEl.getBoundingClientRect()), 360, () => {
        setHeld(heldChar);
        state.animating = false;
      }, 26);
      if (state.level.iceRelease) {
        /* 镜室的冰：水底沉着那个字，没有墙里的“声” */
        narrate('冰“咔”地裂开，塌成一摊水。');
      } else {
        narrate('指尖粘稠拉丝，你意识到这团冰生前居然是口水！');
        /* 隔3秒，左下墙里才渗出一声“声”——“声”字与这句话同时出现，不提前 */
        later(() => {
          narrate('与此同时，左下的墙里，渗出一声极轻的“声”。');
          spawnSound();
        }, 3000);
      }
    }, 480);
  }, 22);
}

/* 水：无实体的背景字，踩得过去 */
function spawnWater(x, y) {
  const el = document.createElement('div');
  el.className = 'cell-char water';
  el.textContent = '水';
  setPos(el, x, y);
  mapEl.appendChild(el);
  state.waterCells.add(key(x, y));
}

/* 被火舌烤化的冰：直接塌成一摊水（不浮出“口”），这格从此也烧不进去 */
function meltIceByFire(ice) {
  const x = ice.x, y = ice.y;
  removeEntity(ice);
  spawnWater(x, y);
  if (!state.flags.fireMeltHinted) {
    state.flags.fireMeltHinted = true;
    narrate('火舌舔上“冰”，冰面嘶嘶作响——它化开成了一摊水，火再没烧进去。');
  }
}

/* 一点“声”从墙外飞进来：飞向 (ex, ey)，途中渐渐消散 */
function flySoundTo(ex, ey, duration, onDone) {
  const el = document.createElement('div');
  el.className = 'sound-fly';
  el.textContent = '声';
  mapEl.appendChild(el);

  const sx = -CELL * .5;
  const sy = ROWS * CELL + CELL * .2;   // 墙外：左下角的外侧
  const anim = el.animate([
    { left: sx + 'px', top: sy + 'px', opacity: 0, transform: 'translate(-50%, -50%) scale(.7)' },
    { left: (sx + (ex - sx) * .4) + 'px', top: (sy + (ey - sy) * .4) + 'px',
      opacity: .72, transform: 'translate(-50%, -50%) scale(1)', offset: .35 },
    { left: ex + 'px', top: ey + 'px', opacity: 0, transform: 'translate(-50%, -50%) scale(1.4)' },
  ], { duration, easing: 'cubic-bezier(.25,.6,.3,1)', fill: 'both' });
  anim.onfinish = () => {
    const alive = el.isConnected;   // 中途切关被清掉时，不再触发后续
    el.remove();
    if (alive && onDone) onDone();
  };
}

/* 冰化开时，墙里传来“声”：从墙外飞进来，渐渐消失；
   在主角用“听”听见它之前，一遍又一遍地响 */
function spawnSound() {
  if (state.flags.soundSpawned) return;
  state.flags.soundSpawned = true;
  soundLoop();
}

function soundLoop() {
  if (state.flags.heard || state.dead) return;
  flySoundTo(2.6 * CELL, (ROWS - 3) * CELL, 2200);
  later(soundLoop, 2200);   // 与动画同长，首尾相接，直到被“听”见
}

/* 手持“听”站到左下角：听力被放大，墙里的声音终于清晰起来 */
function amplifyHearing() {
  if (state.flags.heard || !state.flags.soundSpawned) return;
  state.flags.heard = true;
  sfx.combine();
  mapEl.querySelectorAll('.sound-fly').forEach(el => el.remove());   // 收起循环中的声

  narrate('“有人吗？”');          // 墙里的声音，落在下方对话框里
  later(startSay, 2000);           // 停顿两秒，主角再回应
}

/* 主角喊回去：“_被_住了”——字落进屋里，都是非交互的场景字。
   第一个空位是“我”：由主角亲自站进去；第三个空位是“困”：等玩家把字放到地上 */
function startSay() {
  if (state.flags.sayShown || state.dead) return;
  state.flags.sayShown = true;

  const chars = [null, '被', null, '住', '了'];   // null = 空位
  const spot = findSaySpot(chars.length);
  if (!spot) return;   // 屋里实在摆不下（几乎不可能），保持沉默
  chars.forEach((ch, i) => {
    const x = spot.x + i, y = spot.y;
    if (ch) {
      popIn(spawnSayChar(ch, x, y), x, y);
    } else if (i === 0) {
      state.flags.saySelfPos = { x, y };   // “我”的那一格：主角站进去
      spawnSayBlank(x, y, 'say-blank-self');
    } else {
      state.flags.sayBlank = true;
      state.flags.sayBlankPos = { x, y };
      spawnSayBlank(x, y, '');
    }
  });
  narrate('你朝着墙里喊了回去——');
}

/* 在屋里找一排连续的空位，把那句话放在那儿 */
function findSaySpot(len) {
  const rows = [4, 3, 5, 2, 6, 1, 7].filter(r => r > 0 && r < ROWS - 1);
  for (const y of rows) {
    for (let x = 1; x + len <= COLS - 1; x++) {
      let ok = true;
      for (let i = 0; i < len; i++) {
        if (entityAt(x + i, y)) { ok = false; break; }
        if (state.player.x === x + i && state.player.y === y) { ok = false; break; }
      }
      if (ok) return { x, y };
    }
  }
  return null;
}

function spawnSayChar(ch, x, y, solid = true) {
  const def = { kind: 'scene', solid, say: true };
  const el = document.createElement('div');
  el.className = 'cell-char scene say';
  el.textContent = ch;
  setPos(el, x, y);
  mapEl.appendChild(el);
  const ent = { char: ch, x, y, kind: 'scene', solid, def, el };
  state.entities.set(key(x, y), ent);
  return ent;
}

/* 空位：不占实体格，只是一道等人来填的浅痕 */
function spawnSayBlank(x, y, extra) {
  const el = document.createElement('div');
  el.className = 'cell-char say-blank' + (extra ? ' ' + extra : '');
  el.textContent = '_';
  setPos(el, x, y);
  mapEl.appendChild(el);
}

/* 主角站上“我”的空位时，空痕让位给主角本身 */
function refreshSelfBlank() {
  const p = state.flags.saySelfPos;
  if (!p) return;
  const el = mapEl.querySelector('.say-blank-self');
  if (!el) return;
  el.classList.toggle('filled', state.player.x === p.x && state.player.y === p.y);
}

/* 把落在地上的字收进句子的空位：它成为句子里的一个可交互实体，
   像墙一样挡路，但可以再拾取回来 */
function absorbIntoBlank(ent, pos, slot) {
  const fromTx = ent.x * CELL, fromTy = ent.y * CELL;
  state.entities.delete(key(ent.x, ent.y));

  /* 空位若被先前放下的字占住，先把占位的字退回行囊 */
  const occ = entityAt(pos.x, pos.y);
  if (occ && occ !== ent) { removeEntity(occ); state.bag.push(occ.char); renderBag(); }

  ent.x = pos.x; ent.y = pos.y;
  ent.kind = 'entity'; ent.solid = true;
  ent.saySlot = slot;
  ent.def = {
    kind: 'entity', solid: true, say: true,
    sub: '它嵌在那句话里，可以取回来',
    pickable: true,
    dismantle: null, dismantleWhy: '嵌在句子里，拆不开',
  };
  ent.el.className = 'cell-char entity say-filled';
  state.entities.set(key(pos.x, pos.y), ent);
  setPos(ent.el, pos.x, pos.y);
  ent.el.animate([
    { transform: `translate(${fromTx}px, ${fromTy}px)` },
    { transform: `translate(${pos.x * CELL}px, ${pos.y * CELL}px)` },
  ], { duration: 520, easing: 'cubic-bezier(.25,.7,.3,1)', fill: 'backwards' });
}

/* 把句子里的字取回后，空位重新露出来，可以再填 */
function reopenSayBlank(slot, x, y) {
  if (slot === 'one') {
    state.flags.sayBlank = true;
    state.flags.sayBlankPos = { x, y };
    state.flags.sayFormed = false;
    spawnSayBlank(x, y, '');
  } else {
    state.flags.sayBlank2 = true;
    state.flags.sayBlank2Pos = { x, y };
    spawnSayBlank(x, y, 'say-blank-ask');
  }
}

/* 放到地上的字，正好是那句话缺的答案：让它落进空位。
   返回 true 表示被句子收走了 */
function checkSayAnswer(char, ent) {
  /* 第一句：“我被困住了”缺“困” */
  if (state.flags.sayBlank && char === '困') {
    state.flags.sayBlank = false;
    sfx.combine();
    mapEl.querySelectorAll('.say-blank:not(.say-blank-self)').forEach(el => el.remove());
    absorbIntoBlank(ent, state.flags.sayBlankPos, 'one');
    later(() => {
      if (state.flags.sayBlank) return;   // 已被取回，空位重新空着
      state.flags.sayFormed = true;
      checkSayComplete(true);
    }, 560);
    return true;
  }

  /* 第二句：“你有＿头吗”有三个答案：石 / 斧 / 钻 */
  if (state.flags.sayBlank2 && (char === '石' || char === '斧' || char === '钻')) {
    state.flags.sayBlank2 = false;
    sfx.combine();
    mapEl.querySelectorAll('.say-blank-ask').forEach(el => el.remove());
    absorbIntoBlank(ent, state.flags.sayBlank2Pos, 'two');
    later(() => {
      if (state.entities.get(key(ent.x, ent.y)) !== ent) return;   // 已被取回
      askBranch(char);
    }, 700);
    return true;
  }

  return false;
}

/* “你有＿头吗”的三种回答，各走一条路 */
function askBranch(char) {
  if (char === '石') {
    narrate('墙里那声音顿了顿：“用石头来砸墙似乎没有用……”');
    return;
  }
  if (char === '斧') {
    narrate('“！好主意。”');
    later(() => narrate('“用斧头破墙试试！”'), 1300);
    return;
  }
  if (char === '钻') {
    narrate('“钻头?那边的墙上刚好有个细小的裂缝！钻开它！”');
    state.flags.drillReady = true;
  }
}

/* 完整条件：句子拼齐（“困”就位）＋ 主角站进“我”的空位 */
function checkSayComplete(announceMiss) {
  if (!state.flags.sayFormed || state.flags.sayDone) return;
  const p = state.flags.saySelfPos;
  if (!p) return;

  refreshSelfBlank();
  if (state.player.x !== p.x || state.player.y !== p.y) {
    if (announceMiss) narrate('这句话还缺一个字才成立，是什么呢？');
    return;
  }

  state.flags.sayDone = true;
  sfx.combine();

  /* 主角站定的这一瞬，“我”就留在句子里了（这一格不挡路，主角正站着） */
  const self = state.flags.saySelfPos;
  mapEl.querySelectorAll('.say-blank-self').forEach(el => el.remove());
  spawnSayChar('我', self.x, self.y, false);

  /* 这句话已经说出口，句中的“困”不再能取回 */
  const ku = [...state.entities.values()].find(e => e.saySlot === 'one');
  if (ku) ku.def = { ...ku.def, pickable: false, pickableWhy: '这句话已经说出口了' };

  narrate('你站进了那个空位——“我被困住了。”墙里静了很久，那个声音才慢慢应你：“别急！我可以帮你想想……”');
  later(transformToAsk, 5000);   // 那句话落下，屋里这句又变了
}

/* “我可以帮你想想”之后：整句话散开重排，变成墙里的反问——“你有＿头吗？” */
function transformToAsk() {
  if (state.flags.askShown || state.dead) return;
  state.flags.askShown = true;

  /* 收掉上一句的每一个字与空痕 */
  [...state.entities.values()].filter(e => e.def && e.def.say).forEach(removeEntity);
  mapEl.querySelectorAll('.cell-char.say, .say-blank').forEach(el => el.remove());

  const chars = ['你', '有', null, '头', '吗', '？'];
  const spot = findSaySpot(chars.length);
  if (!spot) return;
  chars.forEach((ch, i) => {
    const x = spot.x + i, y = spot.y;
    if (ch) {
      popIn(spawnSayChar(ch, x, y), x, y);
    } else {
      state.flags.sayBlank2 = true;
      state.flags.sayBlank2Pos = { x, y };
      spawnSayBlank(x, y, 'say-blank-ask');
    }
  });
  narrate('话音还没散，屋里那句话忽然自己变了——“你有　头吗？”');
}

/* 斧砍墙：看着有力，其实毫无作用 */
function axeWall(target) {
  target.el.classList.add('flash');
  later(() => target.el.classList.remove('flash'), 260);
  narrate('斧刃砍在墙上，只崩下一星碎屑——墙纹丝不动。');
}

/* 钻墙：墙面被钻穿，留下一个能走进去的洞 */
function drillWall(target) {
  if (!state.flags.drillReady) {   // 还没对上那句“你有钻头吗”，钻头转不起来
    narrate('钻头顶在墙上，转不起来——你还没想好拿它做什么。');
    return;
  }
  if (state.animating) return;
  state.animating = true;
  sfx.combine();
  target.el.classList.add('flash');
  later(() => {
    removeEntity(target);
    const el = document.createElement('div');
    el.className = 'cell-char scene hole';
    el.textContent = '洞';
    setPos(el, target.x, target.y);
    mapEl.appendChild(el);
    state.entities.set(key(target.x, target.y), {
      char: '洞', x: target.x, y: target.y, kind: 'scene', solid: false,
      def: { kind: 'scene', solid: false }, el,
    });
    narrate('钻头咬穿墙面，碎屑簌簌落下——墙被钻开了一个洞。洞的那边，隐约还有另一间屋子。');
    /* 墙已经钻穿，那句话的答案也就不必再填了——空位就此封上 */
    state.flags.sayBlank2 = false;
    mapEl.querySelectorAll('.say-blank-ask').forEach(el => el.remove());
    state.animating = false;
  }, 420);
}

/* 斧击石：每击一次石亮 20%，第三击石上生火，石恢复原亮度 */
function strikeEntity(target) {
  const cfg = target.def.strike;
  if (state.flags.stoneFired) { narrate('石上再打不出火来。'); return; }

  const next = (target.hits || 0) + 1;
  if (next < cfg.hits) {
    target.hits = next;
    sfx.strike(next);
    target.el.style.filter = `brightness(${1 + 0.2 * next})`;
    return;
  }

  const cell = findSpawnCell(target);
  if (!cell) { narrate('石的上方没有空隙，火起不来。'); return; }

  target.hits = 0;
  state.flags.stoneFired = true;
  sfx.strike(cfg.hits);
  target.el.style.filter = `brightness(${1 + 0.2 * cfg.hits})`;   // 第三击同样变亮 20%
  target.el.classList.add('flash');
  later(() => target.el.classList.remove('flash'), 460);
  later(() => {
    target.el.style.filter = '';        // 火生成，石恢复原亮度
    spawnFire(cell.x, cell.y, cfg.spawn);
  }, 260);
}

/* 生火的位置：优先正上方，被占则向左右下让 */
function findSpawnCell(ent) {
  const dirs = [{ dx: 0, dy: -1 }, { dx: -1, dy: 0 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }];
  for (const d of dirs) {
    const nx = ent.x + d.dx, ny = ent.y + d.dy;
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
    if (entityAt(nx, ny)) continue;
    return { x: nx, y: ny };
  }
  return null;
}

function spawnFire(x, y, char) {
  const ent = spawnCharEntity(char, x, y);
  ent.el.style.opacity = 0;
  const tx = (x * CELL) + 'px', ty = (y * CELL) + 'px';
  const anim = ent.el.animate([
    { transform: `translate(${tx}, ${ty}) scale(2.6)`, opacity: 0 },
    { transform: `translate(${tx}, ${ty}) scale(.9)`, opacity: 1, offset: .55 },
    { transform: `translate(${tx}, ${ty}) scale(1)`, opacity: 1 },
  ], { duration: 520, easing: 'cubic-bezier(.2,.8,.3,1)' });
  anim.onfinish = () => { ent.el.style.opacity = ''; };
  sfx.fire();

  /* 火正好烧在你脚下：闪开 */
  if (state.player.x === x && state.player.y === y) flashToSafety(x, y);

  /* 20 秒内没被“灭”掉，火就开始失控蔓延 */
  later(() => {
    if (state.dead) return;
    const stillBurning = [...state.entities.values()].some(e => e.char === '火');
    if (stillBurning) beginFireSpread();
  }, 20000);

  return ent;
}

/* 闪到火左侧一格（左侧被占则依次让向右、上、下） */
function flashToSafety(fx, fy) {
  const dirs = [{ dx: -1, dy: 0 }, { dx: 1, dy: 0 }, { dx: 0, dy: -1 }, { dx: 0, dy: 1 }];
  const spot = dirs
    .map(d => ({ x: fx + d.dx, y: fy + d.dy }))
    .find(c => c.x >= 0 && c.y >= 0 && c.x < COLS && c.y < ROWS && !entityAt(c.x, c.y));
  if (!spot) return;

  state.player.x = spot.x;
  state.player.y = spot.y;
  playerEl.style.transition = 'none';
  setPos(playerEl, spot.x, spot.y);
  void playerEl.offsetWidth;
  playerEl.style.transition = 'transform .13s ease-out';
  later(() => narrate('好险.....'), 180);
}

/* ============================================================
   十二·五、失控的火：20 秒不灭，每 2 秒向四周蔓延，直至烧穿全屋
   ============================================================ */
function beginFireSpread() {
  if (state.fireSpreading || state.dead) return;
  state.fireSpreading = true;
  narrate('火舌忽然舔上地面——它不听话了，正往四周爬。');
  sfx.fire();
  later(fireTick, 2000);
}

function fireTick() {
  if (state.dead) return;
  spreadFire();
  if (state.dead) return;
  later(fireTick, 2000);
}

function spreadFire() {
  const fires = [...state.entities.values()].filter(e => e.char === '火');
  if (!fires.length) return;

  const targets = new Map();
  for (const f of fires) {
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const x = f.x + dx, y = f.y + dy;
      if (x < 1 || y < 1 || x > COLS - 2 || y > ROWS - 2) continue;   // 墙外不烧
      if (state.waterCells.has(key(x, y))) continue;                  // 水格不烧
      const t = entityAt(x, y);
      if (t && (t.char === '墙' || t.char === '火')) continue;
      targets.set(key(x, y), { x, y });
    }
  }
  if (!targets.size) return;

  sfx.fire();
  let hitPlayer = false;

  targets.forEach(({ x, y }) => {
    /* 火舌舔到“冰”：不管是烧到冰这一格，还是蔓延到冰旁边的格子，冰都会化成一摊水 */
    for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const near = entityAt(x + dx, y + dy);
      if (near && near.char === '冰') meltIceByFire(near);
    }
    if (state.waterCells.has(key(x, y))) return;   // 刚化开的水，火进不去

    const t = entityAt(x, y);
    if (t) removeEntity(t);            // 火过之处，字都被吞掉
    const ent = spawnCharEntity('火', x, y);
    ent.el.classList.add('flash');
    later(() => ent.el.classList.remove('flash'), 320);
    if (state.player.x === x && state.player.y === y) hitPlayer = true;
  });

  if (hitPlayer) { dieByFire(); return; }
  if (!roomAllBurning()) return;

  /* 全屋只剩水那一格没烧着：站在水里的人，暂时还活着 */
  if (state.waterCells.has(key(state.player.x, state.player.y))) {
    if (!state.flags.waterSurvive) {
      state.flags.waterSurvive = true;
      narrate('整间屋子都在烧，只有脚下这洼水还是凉的。');
    }
    return;
  }
  dieByFire();
}

function roomAllBurning() {
  for (let y = 1; y <= ROWS - 2; y++) {
    for (let x = 1; x <= COLS - 2; x++) {
      if (state.waterCells.has(key(x, y))) continue;   // 水格永远烧不着
      const t = entityAt(x, y);
      if (!t || t.char !== '火') return false;
    }
  }
  return true;
}

function dieByFire() {
  if (state.dead) return;
  state.dead = true;
  state.animating = true;
  closeDialog();
  toggleBag(false);
  closeMirror();
  $('overlay').classList.remove('show');
  $('death-overlay').classList.add('show');
  narrate('火吞掉了最后一格。我，也烧没了。');
  sfx.fire();
}

/* ============================================================
   十二·六、镜室：把字放进镜里，翻成它的另一面
   ============================================================ */
/* 镜中的字对：只有“讲得通”的反面，才照得出来 */
const MIRROR_PAIRS = {
  '日': '月', '月': '日',
  '水': '火', '火': '水',
  '关': '开', '开': '关',
  '天': '地', '地': '天',
};

function mirrorEntity() {
  return [...state.entities.values()].find(e => e.def && e.def.mirror);
}

/* 镜面发烫：火就烤在镜前，镜子暂时照不出字 */
function setMirrorHot(hot) {
  state.flags.mirrorHot = hot;
  const m = mirrorEntity();
  if (m) m.el.classList.toggle('mirror-hot', hot);
}

/* ---------- 镜中变形：把字打散成粒子，螺旋卷入镜心，再螺旋散出、聚成另一个字 ---------- */

/* 把字渲染到离屏画布，按像素透明度采样成粒子（坐标相对字心） */
function glyphParticles(char, fontSize) {
  const S = Math.ceil(fontSize * 1.9);
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const ctx = cv.getContext('2d');
  if (!ctx) return { pts: [], maxR: fontSize * .5 };

  ctx.font = `${fontSize}px "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(char, S / 2, S / 2 + fontSize * .02);

  const data = ctx.getImageData(0, 0, S, S).data;
  const step = 4;            // 采样步长：控制粒子数量
  const pts = [];
  let maxR = 1;
  for (let y = 0; y < S; y += step) {
    for (let x = 0; x < S; x += step) {
      if (data[(y * S + x) * 4 + 3] < 140) continue;   // 只要笔画实心处
      const px = x - S / 2, py = y - S / 2;
      const r = Math.hypot(px, py);
      if (r > maxR) maxR = r;
      pts.push({ r, a: Math.atan2(py, px) });
    }
  }
  return { pts, maxR };
}

/* 取消正在播放的镜中变形，并清理画布 */
function cancelMirrorMorph() {
  if (state.mirrorWarpRaf) { cancelAnimationFrame(state.mirrorWarpRaf); state.mirrorWarpRaf = 0; }
  const cv = $('mirror-vortex');
  if (cv) cv.remove();
  const frame = $('mirror-frame');
  if (frame) frame.classList.remove('morphing');
  const core = $('mirror-core');
  if (core) core.style.opacity = '';
}

/* 入场：原字被卷进镜心 → 镜心闪光 → 出场：新字从镜心螺旋散开聚形。
   onDone 在整段动画结束时触发（此时核心已换成新字并带发光）。 */
function playMirrorMorph(fromChar, toChar, onDone) {
  cancelMirrorMorph();
  const frame = $('mirror-frame'), core = $('mirror-core');
  if (!frame || !core) { onDone && onDone(); return; }

  const fw = frame.clientWidth, fh = frame.clientHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cv = document.createElement('canvas');
  cv.id = 'mirror-vortex';
  cv.width = Math.round(fw * dpr);
  cv.height = Math.round(fh * dpr);
  cv.style.width = fw + 'px';
  cv.style.height = fh + 'px';
  frame.appendChild(cv);
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  frame.classList.add('morphing');
  core.style.opacity = '0';   // 期间由粒子替代核心字

  const A = glyphParticles(fromChar, 116);
  const B = glyphParticles(toChar, 116);
  const cx = fw / 2, cy = fh / 2;
  const IN = 720, HOLD = 220, OUT = 720, TOTAL = IN + HOLD + OUT;
  const SPIN = -Math.PI * 2.15;                 // 逆时针卷过两圈多
  const easeIn = t => t * t * (2.2 - 1.2 * t);  // 越卷越快
  const easeOut = t => 1 - Math.pow(1 - t, 3);  // 越散越缓
  const t0 = performance.now();
  let switched = false;

  const dot = (x, y, s, alpha) => {
    ctx.fillStyle = `rgba(223, 234, 245, ${alpha.toFixed(3)})`;
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  };

  function drawIn(t) {
    const e = easeIn(t);
    const fade = 1 - Math.pow(t, 4);   // 临近镜心时整体淡出
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of A.pts) {
      const k = p.r / A.maxR;
      const theta = p.a + SPIN * e * (0.72 + 0.55 * (1 - k));   // 内外圈转速差，形成螺旋剪切
      const x = cx + Math.cos(theta) * p.r * (1 - e);
      const y = cy + Math.sin(theta) * p.r * (1 - e);
      dot(x, y, 3 * (1 - .55 * e), fade * (0.45 + 0.55 * (1 - k)));
    }
    ctx.restore();
  }

  function drawFlash(t) {
    const r = 6 + easeOut(t) * Math.min(fw, fh) * .55;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, `rgba(255, 255, 255, ${(0.95 * (1 - t)).toFixed(3)})`);
    g.addColorStop(.45, `rgba(198, 226, 255, ${(0.45 * (1 - t)).toFixed(3)})`);
    g.addColorStop(1, 'rgba(160, 200, 255, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, fw, fh);
  }

  function drawOut(t) {
    if (!switched) { switched = true; core.textContent = toChar; }
    const e = easeOut(t);
    /* 末段让真实的新字淡入，粒子同时淡出，避免交接处跳变 */
    core.style.opacity = String(Math.max(0, (t - .62) / .38).toFixed(3));
    const fade = Math.min(1, (1 - t) / .35);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of B.pts) {
      const theta = p.a + SPIN * (1 - e) * 0.5;
      const x = cx + Math.cos(theta) * p.r * e;
      const y = cy + Math.sin(theta) * p.r * e;
      dot(x, y, 1.4 + 1.6 * e, fade);
    }
    ctx.restore();
  }

  const step = now => {
    const el = now - t0;
    ctx.clearRect(0, 0, fw, fh);
    if (el < IN) {
      drawIn(el / IN);
    } else if (el < IN + HOLD) {
      drawFlash((el - IN) / HOLD);
    } else if (el < TOTAL) {
      drawOut((el - IN - HOLD) / OUT);
    } else {
      cancelMirrorMorph();
      core.textContent = toChar;
      core.style.opacity = '';
      core.className = 'flashing';
      onDone && onDone();
      return;
    }
    state.mirrorWarpRaf = requestAnimationFrame(step);
  };
  state.mirrorWarpRaf = requestAnimationFrame(step);
}

/* 镜前的空地：优先正下方，再向左右铺开，避开主角站着的格子 */
function mirrorFrontCell(mirror) {
  const y = mirror.y + 1;
  const xs = [mirror.x];
  for (let d = 1; d <= 3; d++) { xs.push(mirror.x + d, mirror.x - d); }
  for (const x of xs) {
    if (x < 1 || x > COLS - 2 || y < 1 || y > ROWS - 2) continue;
    if (x === state.player.x && y === state.player.y) continue;
    if (entityAt(x, y)) continue;
    return { x, y };
  }
  return findSpawnCell(mirror);
}

/* 撞上镜面：蒙雾 / 发烫 / 可用，三种状态 */
function useMirror(mirror) {
  if (mirror.fogged) {
    if (state.player.held === '日') clearMirrorMist(mirror);
    else narrate('镜面蒙着一层白雾，照不出人。也许该给它一点“日”头。');
    return;
  }
  if (state.flags.mirrorHot) {
    narrate('镜面烫得照不出人。得先灭火——可拿什么压？');
    return;
  }
  openMirror(mirror);
}

/* “日”贴上雾镜：白雾一照就散，凝成一摊可拾起的“水”，镜面照得出人了 */
function clearMirrorMist(mirror) {
  if (state.animating) return;
  state.animating = true;
  sfx.combine();
  mirror.fogged = false;
  mirror.el.classList.remove('mirror-fogged');
  mirror.el.classList.add('flash');
  later(() => {
    mirror.el.classList.remove('flash');
    const cell = mirrorFrontCell(mirror);
    if (cell) {
      const water = spawnCharEntity('水', cell.x, cell.y);
      popIn(water, cell.x, cell.y);
    }
    state.animating = false;
    narrate('“日”贴上去，镜面的白雾一照就散，凝成一小摊“水”浮在镜前。镜面终于照得出人了。');
  }, 520);
}

function openMirror(mirror) {
  state.mirrorOpen = true;
  state.mirrorBusy = false;
  state.mirrorEl = mirror;
  const core = $('mirror-core');
  core.textContent = '镜';
  core.className = '';
  core.style.opacity = '';
  $('mirror-overlay').classList.add('show');
  toggleBag(false);
  renderMirrorBag();
  sfx.open();
}

function closeMirror() {
  cancelMirrorMorph();
  state.mirrorOpen = false;
  state.mirrorBusy = false;
  state.mirrorEl = null;
  const core = $('mirror-core');
  if (core) { core.className = ''; core.style.opacity = ''; }
  $('mirror-overlay').classList.remove('show');
}

/* 镜中的行囊：所有字排成一行，最右永远站着一个金色的“我” */
function renderMirrorBag() {
  const row = $('mirror-bag');
  row.innerHTML = '';
  if (!state.bag.length) {
    const em = document.createElement('div');
    em.className = 'mirror-empty';
    em.textContent = '行 囊 空 空';
    row.appendChild(em);
  }
  state.bag.forEach(char => {
    const slot = document.createElement('div');
    slot.className = 'mirror-slot';
    slot.textContent = char;
    applyWoodColor(slot, char);
    slot.onclick = () => { if (!state.mirrorBusy) convertInMirror(char); };
    row.appendChild(slot);
  });
  const me = document.createElement('div');
  me.className = 'mirror-slot mirror-self';
  me.textContent = '我';
  me.onclick = () => { if (!state.mirrorBusy) mirrorSwapSelf(); };
  row.appendChild(me);
}

/* 放字入镜：有另一面的，螺旋变形后翻成新字；没有的，晃一圈退回行囊 */
function convertInMirror(char) {
  const to = MIRROR_PAIRS[char];
  const core = $('mirror-core');
  if (!to) {
    core.classList.remove('mirror-shake');
    void core.offsetWidth;
    core.classList.add('mirror-shake');
    sfx.bump();
    narrate('“' + char + '”落进镜里，镜面晃了一下，什么也没变。它退回了行囊。');
    return;
  }

  state.mirrorBusy = true;
  const idx = state.bag.indexOf(char);
  if (idx >= 0) state.bag.splice(idx, 1);   // 字离开行囊，进了镜中
  if (state.player.held === char) setHeld(null);   // 手里的字也跟着进了镜子
  renderMirrorBag();
  core.textContent = char;
  sfx.combine();

  playMirrorMorph(char, to, () => {
    if (state.dead || state.ending) { closeMirror(); return; }
    if (to === '火') {
      /* “火”拿不住：直接从镜面里跌到镜前，开始 20 秒倒计时 */
      const cell = state.mirrorEl ? mirrorFrontCell(state.mirrorEl) : null;
      if (cell) {
        const fire = spawnFire(cell.x, cell.y, '火');
        fire.fromMirror = true;
      }
      setMirrorHot(true);
      narrate('“水”在镜中越转越急，“腾”地烧了起来——“火”从镜面里跌出来，落在镜前。镜面被烤得发烫。');
    } else {
      state.bag.push(to);
      narrate(to === '开'
        ? '“关”在镜里打了个转，翻成了“开”。镜面上，门的方向亮了一下。'
        : '“' + char + '”在镜中翻了个面，成了“' + to + '”。');
    }
    renderBag();
    popBagBtn();
    /* 保持忙碌锁住输入，让新字在镜中亮一下再收镜 */
    later(() => { if (state.mirrorOpen) closeMirror(); }, 560);
  });
}

/* 彩蛋：镜子里也有一个“我”。把它拖进来，两个“我”换了位置 */
function mirrorSwapSelf() {
  state.mirrorBusy = true;
  const core = $('mirror-core');
  core.textContent = '我';
  sfx.combine();

  playMirrorMorph('我', '你', () => {
    if (state.dead || state.ending) { closeMirror(); return; }
    state.flags.mirrorSwapped = true;
    playerEl.innerHTML = '你<span id="held-char"></span>';
    const hc = $('held-char');
    hc.textContent = state.player.held || '';
    applyWoodColor(hc, state.player.held);
    narrate('镜子里的人朝你笑了笑。你们换了位置。');
    later(() => { if (state.mirrorOpen) closeMirror(); }, 560);
  });
}

/* 门：拿着“开”撞上去，门后就是终章 */
function openDoorAndEnd() {
  if (state.animating) return;
  state.animating = true;
  sfx.combine();
  const idx = state.bag.indexOf('开');
  if (idx >= 0) state.bag.splice(idx, 1);
  setHeld(null);
  narrate('“开”嵌进门里——门，开了。');
  later(showEnding, 1800);
}

function showEnding() {
  if (state.ending) return;
  state.ending = true;
  state.animating = true;
  closeDialog();
  toggleBag(false);
  closeMirror();
  $('ending-overlay').classList.add('show');
  sfx.combine();
}

/* ============================================================
   十三、飞行字符 / 实体增删
   ============================================================ */
function flyChar(char, from, to, duration, onDone, fontSize = 26) {
  const el = document.createElement('div');
  el.className = 'fly-char';
  el.textContent = char;
  el.style.fontSize = fontSize + 'px';
  el.style.left = from.x + 'px';
  el.style.top = from.y + 'px';
  document.body.appendChild(el);
  el.animate([
    { left: from.x + 'px', top: from.y + 'px', opacity: 1, transform: 'translate(-50%,-50%) scale(1)' },
    { left: to.x + 'px', top: to.y + 'px', opacity: .85, transform: 'translate(-50%,-50%) scale(.38)' },
  ], { duration, easing: 'cubic-bezier(.45,0,.75,.35)', fill: 'forwards' });
  later(() => { el.remove(); onDone && onDone(); }, duration);
}

function popBagBtn() {
  bagBtn.classList.remove('pop');
  void bagBtn.offsetWidth;
  bagBtn.classList.add('pop');
}

function removeEntity(entity) {
  state.entities.delete(key(entity.x, entity.y));
  entity.el.remove();
}

/* 原地弹出：新生成的字从大到小落定 */
function popIn(ent, x, y) {
  const tx = (x * CELL) + 'px', ty = (y * CELL) + 'px';
  ent.el.style.opacity = 0;
  const a = ent.el.animate([
    { transform: `translate(${tx}, ${ty}) scale(1.5)`, opacity: 0 },
    { transform: `translate(${tx}, ${ty}) scale(.94)`, opacity: 1, offset: .6 },
    { transform: `translate(${tx}, ${ty}) scale(1)`, opacity: 1 },
  ], { duration: 380, easing: 'cubic-bezier(.2,.8,.3,1)' });
  a.onfinish = () => { ent.el.style.opacity = ''; };
}

const genericDropDef = char => ({
  kind: 'entity', solid: true, sub: '你把它放在了地上',
  pickable: true, dismantle: null, dismantleWhy: '拆无可拆',
});

/* “木”的成色：本色棕 / 烧红 / 浇灭后发灰 */
const WOOD_CLASSES = ['wood-color-wood', 'wood-color-lit', 'wood-color-ash'];
function woodColorClass() {
  if (state.flags.litWood) return 'wood-color-lit';
  if (state.flags.ashWood) return 'wood-color-ash';
  return 'wood-color-wood';
}
function applyWoodColor(el, char) {
  if (!el) return;
  el.classList.remove(...WOOD_CLASSES);
  if (char === '木') el.classList.add(woodColorClass());
}

function spawnCharEntity(char, x, y) {
  const def = CHARS[char] || genericDropDef(char);
  const el = document.createElement('div');
  el.className = 'cell-char ' +
    (def.kind === 'scene' ? (def.grass ? 'grass' : 'scene') : (def.chain ? 'chain' : 'entity')) +
    (def.cls ? ' ' + def.cls : '');
  el.textContent = char;
  applyWoodColor(el, char);
  setPos(el, x, y);
  mapEl.appendChild(el);
  const ent = { char, x, y, kind: def.kind, solid: def.solid, def, el };
  state.entities.set(key(x, y), ent);
  return ent;
}

/* ============================================================
   十四、背包 · 手持 · 放下
   ============================================================ */
/* 落点：优先身前，其次下右上左；有链时优先牢笼内的空地 */
function findDropCell() {
  const p = state.player;
  const f = p.facing || { dx: 0, dy: 1 };
  const dirs = [f, { dx: 0, dy: 1 }, { dx: 1, dy: 0 }, { dx: 0, dy: -1 }, { dx: -1, dy: 0 }];
  const seen = new Set(), free = [];
  for (const d of dirs) {
    const tag = d.dx + ',' + d.dy;
    if (seen.has(tag)) continue;
    seen.add(tag);
    const nx = p.x + d.dx, ny = p.y + d.dy;
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
    if (entityAt(nx, ny)) continue;
    free.push({ x: nx, y: ny });
  }
  if (!free.length) return null;
  if (state.leash) {
    const L = state.leash;
    const inside = free.find(c => c.x >= L.x1 && c.x <= L.x2 && c.y >= L.y1 && c.y <= L.y2);
    if (inside) return inside;
  }
  return free[0];
}

function dropChar(char, fromRect) {
  if (state.animating) return;
  const idx = state.bag.indexOf(char);
  const isHeld = state.player.held === char;
  if (idx < 0 && !isHeld) return;      // 手持物可能不在背包里（如劈链后飞回手上的斧）
  const cell = findDropCell();
  if (!cell) { sfx.bump(); narrate('四周没有空地，无处安放。'); return; }

  /* 链还拴着的时候，字被扔出了那 2×2 的亮处：看不见，也够不到 */
  const L = state.leash;
  const lost = !!L && (cell.x < L.x1 || cell.x > L.x2 || cell.y < L.y1 || cell.y > L.y2);

  if (idx >= 0) state.bag.splice(idx, 1);
  if (isHeld) {
    state.player.held = null;
    $('held-char').textContent = '';
    $('held-char').classList.remove(...WOOD_CLASSES);
  }
  renderBag();
  sfx.open();

  const ent = spawnCharEntity(char, cell.x, cell.y);
  ent.el.style.opacity = 0;
  const er = ent.el.getBoundingClientRect();
  const pr = playerEl.getBoundingClientRect();
  const from = fromRect
    ? { x: fromRect.left + fromRect.width / 2, y: fromRect.top + fromRect.height / 2 }
    : { x: pr.left + pr.width / 2, y: pr.top + pr.height / 2 };
  const to = { x: er.left + er.width / 2, y: er.top + er.height / 2 };

  flyChar(char, from, to, 380, () => {
    ent.el.style.opacity = '';
    const tx = (cell.x * CELL) + 'px', ty = (cell.y * CELL) + 'px';
    ent.el.animate([
      { transform: `translate(${tx}, ${ty}) scale(1.55)`, opacity: 0 },
      { transform: `translate(${tx}, ${ty}) scale(.94)`, opacity: 1, offset: .6 },
      { transform: `translate(${tx}, ${ty}) scale(1)`, opacity: 1 },
    ], { duration: 360, easing: 'cubic-bezier(.2,.8,.3,1)' });
    checkSayAnswer(char, ent);   // 落进空里的字，可能正是那句话缺的答案
    /* 藏在黑暗里的“成就”：字被扔到了链子够不到的地方 */
    if (lost) {
      later(() => {
        narrate('哦不....');
        later(() => narrate('“' + char + '”字被你扔到了你所触及不到的地方。'), 2000);
      }, 2000);
    }
  });

  completeStep('drop');
}

function renderBag() {
  const grid = $('bag-grid');
  grid.innerHTML = '';
  $('bag-count').textContent = state.bag.length || '';
  if (!state.bag.length) {
    grid.innerHTML = '<div id="bag-empty">行 囊 空 空</div>';
    return;
  }
  state.bag.forEach(char => {
    const slot = document.createElement('div');
    slot.className = 'bag-slot' + (state.player.held === char ? ' held' : '');
    slot.textContent = char;
    applyWoodColor(slot, char);
    slot.title = '左键手持 · 右键放下';
    slot.onclick = () => {
      openVision();
      setHeld(state.player.held === char ? null : char);
      if (state.player.held) completeStep('hold');
      sfx.open();
    };
    slot.oncontextmenu = e => {
      e.preventDefault();
      openVision();
      dropChar(char, slot.getBoundingClientRect());
    };
    grid.appendChild(slot);
  });
}

function setHeld(char) {
  state.player.held = char;
  const hc = $('held-char');
  hc.textContent = char || '';
  applyWoodColor(hc, char);
  renderBag();

  /* 已站在左下角时再拿起“听”，同样放大听力 */
  if (char === '听' && state.player.x === 1 && state.player.y === ROWS - 2) amplifyHearing();
}

function toggleBag(force) {
  state.bagOpen = force !== undefined ? force : !state.bagOpen;
  bagPanel.classList.toggle('show', state.bagOpen);
  sfx.open();
  if (state.bagOpen) { renderBag(); completeStep('openbag'); }
}

/* ============================================================
   十五、输入
   ============================================================ */
document.addEventListener('keydown', e => {
  initAudio();
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();

  /* R 重开本关：任何时候都生效 */
  if (k === 'r') { gotoLevel(state.levelIndex); return; }
  if (switching || state.dead) return;
  if (state.ending) return;

  /* 镜的全屏界面：只认 Esc（翻转动画中不响应），其余按键一律忽略 */
  if (state.mirrorOpen) {
    if (k === 'escape' && !state.mirrorBusy) closeMirror();
    return;
  }

  /* 拆字动画进行中：任意键跳过，直接收尾 */
  if (state.skipAnim) { state.skipAnim(); return; }
  openVision();   // 任意行动：视野自主角散开

  /* 对话框打开：1 拆解 / 2 拾取 / Esc 离开；按移动键则收起面板、直接走开 */
  if (state.dialogFor) {
    const ent = state.dialogFor;
    const isMove = ['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k);
    if (k === '1' && ent.def.dismantle) { dismantle(ent); return; }
    if (k === '2' && ent.def.pickable) { pickUp(ent); return; }
    if (k === 'escape') { closeDialog(); return; }
    if (!isMove) return;
    closeDialog();
  }

  if (k === 'f') { toggleBag(); return; }
  if (k === 'g') { if (state.player.held) dropChar(state.player.held, bagBtn.getBoundingClientRect()); return; }
  if (k === 'escape') { if (state.bagOpen) toggleBag(false); return; }
  if (state.animating) return;

  if (k === 'w' || k === 'arrowup') tryMove(0, -1);
  else if (k === 's' || k === 'arrowdown') tryMove(0, 1);
  else if (k === 'a' || k === 'arrowleft') tryMove(-1, 0);
  else if (k === 'd' || k === 'arrowright') tryMove(1, 0);
});

bagBtn.addEventListener('click', () => { initAudio(); openVision(); toggleBag(); });

/* 对话框按钮：鼠标点击，与键盘 1 / 2 / Esc 等效 */
$('btn-dismantle').addEventListener('click', () => {
  const ent = state.dialogFor;
  if (ent && ent.def.dismantle) { openVision(); dismantle(ent); }
});
$('btn-pickup').addEventListener('click', () => {
  const ent = state.dialogFor;
  if (ent && ent.def.pickable) { openVision(); pickUp(ent); }
});
$('btn-leave').addEventListener('click', () => { openVision(); closeDialog(); });

/* 拆字动画中：鼠标左键 / 右键也能跳过（捕获阶段拦下，避免同时触发行囊等点击） */
document.addEventListener('mousedown', e => {
  if (!state.skipAnim) return;
  state.skipAnim();
  e.preventDefault();
  e.stopPropagation();
}, true);

/* 点击对话框之外即关闭（行囊是常驻侧栏，只由行囊按钮收合） */
document.addEventListener('mousedown', e => {
  if (state.dialogFor && !dialogEl.contains(e.target)) closeDialog();
});

/* 镜的全屏界面：点镜子与行囊之外的地方，退出 */
document.addEventListener('mousedown', e => {
  if (!state.mirrorOpen || state.mirrorBusy) return;
  if (!e.target.closest('#mirror-frame, #mirror-tip, #mirror-bag')) closeMirror();
});
document.addEventListener('contextmenu', e => e.preventDefault());

/* ============================================================
   十六、窗口自适应缩放 + 启动
   ============================================================ */
function fit() {
  /* 宽度预算含右侧行囊（728 + 314），保证侧栏不会被挤出屏幕 */
  const s = Math.min(1, (innerWidth - 60) / 1060, (innerHeight - 60) / 720);
  $('stage').style.transform = `translate(-50%, -50%) scale(${s})`;
}
window.addEventListener('resize', fit);

fit();
loadLevel(0);
</script>

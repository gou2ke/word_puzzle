<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字·界</title>
<style>
/* ============================================================
   字·界 —— 单文件版
   纯原生 HTML/CSS/JS，零依赖，双击 index.html 即可运行
   关卡全部是数据（LEVELS），引擎与配方表（CHARS）全局共用
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

html, body {
  height: 100%;
  background: #060609;
  overflow: hidden;
  font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
  color: #c9c9c2;
}

/* ---------- 整体舞台 ---------- */
#stage {
  position: fixed;
  left: 50%; top: 50%;
  transform-origin: center center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

#title-corner {
  position: fixed;
  left: 22px; top: 18px;
  font-size: 15px;
  color: #8d8d80;
  letter-spacing: 2px;
  z-index: 5;
}
#level-select { margin-left: 12px; }
.lvl-btn {
  background: transparent;
  border: 1px solid #2c2c38;
  color: #6a6a60;
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 3px 10px;
  margin-left: 6px;
  cursor: pointer;
  border-radius: 2px;
  transition: color .15s, border-color .15s, background .15s;
}
.lvl-btn:hover { color: #d8c78a; border-color: #d8c78a; }
.lvl-btn.active { color: #d8c78a; border-color: #d8c78a; background: rgba(216, 199, 138, .1); }

/* ---------- 目标条 ---------- */
#objective-bar {
  padding: 8px 22px;
  background: rgba(14, 14, 20, .85);
  border: 1px solid #2c2c38;
  border-radius: 20px;
  font-size: 14px;
  letter-spacing: 1.5px;
  color: #d8c78a;
  transition: box-shadow .4s;
}
#objective-bar.flash { box-shadow: 0 0 18px rgba(216, 199, 138, .45); }
#obj-diamond { margin-right: 8px; font-size: 12px; }

/* ---------- 地图 ---------- */
#map {
  position: relative;
  overflow: hidden;   /* 视野黑幕的阴影不出房间 */
  width: 728px;   /* 13 格 × 56 */
  height: 504px;  /* 9 格 × 56 */
  background:
    linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
  background-size: 56px 56px;
  border: 1px solid #23232c;
  box-shadow: 0 0 60px rgba(0, 0, 0, .8) inset;
}

/* ---------- 视野：房间初始全黑，行动后自主角为中心散开 ---------- */
#vision {
  position: absolute;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  background: #000;
  -webkit-mask-image: radial-gradient(circle var(--vr, 1px) at var(--vx, 50%) var(--vy, 50%),
    transparent 0, transparent 62%, rgba(0, 0, 0, .55) 82%, #000 100%);
  mask-image: radial-gradient(circle var(--vr, 1px) at var(--vx, 50%) var(--vy, 50%),
    transparent 0, transparent 62%, rgba(0, 0, 0, .55) 82%, #000 100%);
  transition: opacity .28s ease-out;
}
#vision.clear { opacity: 0; }

/* 链的视野窗：只有活动范围那一块是亮的，其余由巨大阴影压黑 */
#leash-vision {
  position: absolute;
  left: 0; top: 0;
  width: 0; height: 0;
  z-index: 40;
  pointer-events: none;
  box-shadow: 0 0 0 9999px #000;
  transition: left .55s cubic-bezier(.2, .8, .3, 1),
              top .55s cubic-bezier(.2, .8, .3, 1),
              width .55s cubic-bezier(.2, .8, .3, 1),
              height .55s cubic-bezier(.2, .8, .3, 1),
              opacity .3s ease-out;
}

/* 链的活动范围地砖（在字之下） */
.range-tile {
  position: absolute;
  width: 56px; height: 56px;
  transform: translate(var(--tx, 0), var(--ty, 0));
  background: rgba(216, 199, 138, .05);
  box-shadow: inset 0 0 0 1px rgba(216, 199, 138, .10);
  pointer-events: none;
  z-index: 0;
}

/* 地图上所有的“字” */
.cell-char {
  position: absolute;
  left: 0; top: 0;
  width: 56px; height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(var(--tx, 0), var(--ty, 0));
  font-size: 24px;
  pointer-events: none;
  z-index: 1;
}

/* 场景字：灰暗、安静 */
.cell-char.scene { color: #55555f; }
.cell-char.grass { color: #3d4f3c; font-size: 20px; }
/* 钻开的洞：墙面上缺了一块，透着外面更深的黑 */
.cell-char.hole {
  color: #2f2f33;
  text-shadow: 0 0 10px rgba(0, 0, 0, .95);
  animation: holeFade 3s ease-in-out infinite;
}
@keyframes holeFade {
  0%, 100% { opacity: .55; }
  50%      { opacity: .9; }
}

/* 带裂缝的墙：墙面上多了一道细裂，只有这里能下钻 */
.cell-char.wall-cracked { color: #625f55; }
.cell-char.wall-cracked::before,
.cell-char.wall-cracked::after {
  content: '';
  position: absolute;
  border-radius: 1px;
  background: linear-gradient(180deg, rgba(4, 4, 6, .98), rgba(12, 12, 14, .85));
  box-shadow: 1px 0 0 rgba(214, 202, 168, .22), 0 0 5px rgba(0, 0, 0, .95);
  pointer-events: none;
}
.cell-char.wall-cracked::before {
  left: 26px; top: 12px;
  width: 2px; height: 26px;
  transform: rotate(15deg);
}
.cell-char.wall-cracked::after {
  left: 29px; top: 34px;
  width: 2px; height: 12px;
  transform: rotate(-36deg);
}

/* 可交互实体：淡金色呼吸光 */
.cell-char.entity {
  color: #d8c78a;
  animation: breathe 2.6s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { text-shadow: 0 0 4px rgba(216,199,138,.25); }
  50%      { text-shadow: 0 0 14px rgba(216,199,138,.75); }
}
/* 引导关专属配色：灰白的“一”、纯白的“明”、红棕的“树” */
.cell-char.tint-gray {
  color: #cfccc6;
  animation: none;
  text-shadow: 0 0 6px rgba(235, 235, 230, .22);
}
.cell-char.tint-white {
  color: #ffffff;
  animation: none;
  text-shadow: 0 0 10px rgba(255, 255, 255, .55);
}
.cell-char.scene.tint-brown {
  color: #8f4a30;
  text-shadow: 0 0 6px rgba(143, 74, 48, .25);
}

/* 链：拴住你的字，冷白 */
.cell-char.chain {
  color: #c8cfd8;
  animation: chainGlow 2.2s ease-in-out infinite;
}
@keyframes chainGlow {
  0%, 100% { text-shadow: 0 0 5px rgba(180, 200, 220, .3); }
  50%      { text-shadow: 0 0 16px rgba(180, 200, 220, .8); }
}

/* 火：红，跳动 */
.cell-char.fire {
  color: #ff5c3a;
  animation: fireGlow 1.5s ease-in-out infinite;
}
@keyframes fireGlow {
  0%, 100% { text-shadow: 0 0 6px rgba(255, 80, 40, .45); }
  50%      { text-shadow: 0 0 22px rgba(255, 110, 50, .95); }
}

/* 水：无实体的背景字，踩得过去 */
.cell-char.water {
  z-index: 0;
  color: rgba(126, 182, 214, .55);
  font-size: 26px;
  text-shadow: 0 0 14px rgba(126, 182, 214, .35);
}

/* “木”的三种成色：没烧过是棕色，烧着了是红色，被冰浇灭后发灰 */
.cell-char.wood-color-wood, .bag-slot.wood-color-wood, .mirror-slot.wood-color-wood, #held-char.wood-color-wood {
  color: #b08153;
  text-shadow: 0 0 10px rgba(176, 129, 83, .45);
}
.cell-char.wood-color-lit, .bag-slot.wood-color-lit, .mirror-slot.wood-color-lit, #held-char.wood-color-lit {
  color: #ff6a45;
  text-shadow: 0 0 14px rgba(255, 90, 50, .85);
}
.cell-char.wood-color-ash, .bag-slot.wood-color-ash, .mirror-slot.wood-color-ash, #held-char.wood-color-ash {
  color: #8a8a86;
  text-shadow: 0 0 8px rgba(150, 150, 145, .22);
}

/* 声：从墙外飞进来、一路飘散的响动 */
.sound-fly {
  position: absolute;
  left: 0; top: 0;
  z-index: 5;
  font-size: 22px;
  color: #9fb2c8;
  text-shadow: 0 0 14px rgba(160, 190, 220, .6);
  pointer-events: none;
  will-change: left, top, opacity;
}

/* 主角说出口的话：落在屋里的场景字，非交互、踩得过去 */
.cell-char.say {
  color: #e6e1d0;
  text-shadow: 0 0 14px rgba(215, 220, 235, .5);
  z-index: 2;
}
/* 话里缺的那个字：空位上一道浅痕，等答案落进来 */
.cell-char.say-blank {
  color: #6f6a55;
  z-index: 2;
  animation: sayBlankPulse 1.6s ease-in-out infinite;
}
/* 填进句子的字：既是句子的一部分，也是能取回来的实体 */
.cell-char.say-filled {
  color: #ffd27a;
  text-shadow: 0 0 14px rgba(255, 210, 122, .8);
}
@keyframes sayBlankPulse {
  0%, 100% { opacity: .35; }
  50%      { opacity: 1; text-shadow: 0 0 12px rgba(216, 199, 138, .6); }
}
/* “我”那一格由主角亲自站进去，空痕便让位给主角 */
.cell-char.say-blank.filled { opacity: 0 !important; animation: none; }

/* 门：通往下一间屋子 */
.cell-char.door {
  color: #c8b184;
  animation: doorGlow 2.4s ease-in-out infinite;
}
@keyframes doorGlow {
  0%, 100% { text-shadow: 0 0 6px rgba(216, 199, 138, .3); }
  50%      { text-shadow: 0 0 22px rgba(255, 232, 170, .9); }
}

/* “死”去的字（灭）：失去碰撞、失去光泽。放在 .fire 之后，保证盖过火焰样式 */
.cell-char.dead { color: #5a5a5a; opacity: .55; animation: none; }

/* 被撞时的抖动 */
.cell-char.shake { animation: shake .26s, breathe 2.6s ease-in-out infinite; }
.cell-char.scene.shake { animation: shake .26s; }
.cell-char.chain.shake { animation: shake .26s, chainGlow 2.2s ease-in-out infinite; }
.cell-char.fire.shake { animation: shake .26s, fireGlow 1.5s ease-in-out infinite; }
@keyframes shake {
  25% { transform: translate(calc(var(--tx) + 3px), var(--ty)); }
  50% { transform: translate(calc(var(--tx) - 3px), var(--ty)); }
  75% { transform: translate(calc(var(--tx) + 2px), var(--ty)); }
}

/* 草被踩过的晃动 */
.cell-char.rustle { animation: rustle .5s; }
@keyframes rustle {
  30% { transform: translate(var(--tx), var(--ty)) rotate(12deg); color: #5c7a50; }
}

/* 合成时的白闪 */
.cell-char.flash { animation: flash .45s; }
@keyframes flash {
  30% { color: #ffffff; text-shadow: 0 0 30px #fff, 0 0 60px #ffd27a; transform: translate(var(--tx), var(--ty)) scale(1.35); }
}

/* 对话框聚焦的实体 */
.cell-char.focus { color: #ffe9a8; text-shadow: 0 0 18px rgba(255, 220, 140, .9); }

/* ---------- 主角“我” ---------- */
#player {
  z-index: 41;   /* 高于全黑视野层：黑暗里唯独“我”可见 */
  font-size: 27px;
  color: #f4f4f4;
  text-shadow: 0 0 16px rgba(255, 255, 255, .65);
  transition: transform .13s ease-out;
}
/* 手持物：主角右上角的小字 */
#held-char {
  position: absolute;
  right: -6px; top: -6px;
  font-size: 15px;
  color: #d8c78a;
  text-shadow: 0 0 8px rgba(216, 199, 138, .8);
  animation: breathe 2s ease-in-out infinite;
}

/* ---------- 叙述栏 ---------- */
#narrative {
  width: 728px;
  min-height: 66px;
  padding: 12px 18px;
  border-left: 2px solid #3a3a46;
  background: rgba(12, 12, 17, .6);
  font-size: 15px;
  line-height: 1.8;
  letter-spacing: 1px;
  color: #b9b9ae;
}
#narr-diamond { color: #6a6a75; margin-right: 8px; font-size: 12px; }
#type-cursor { color: #6a6a75; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- 左下按键提示 ---------- */
#keys-hint {
  position: fixed;
  left: 22px; bottom: 18px;
  font-size: 12px;
  color: #4c4c46;
  letter-spacing: 1.5px;
  z-index: 5;
}
#keys-hint b { color: #7c7c72; font-weight: normal; }

/* ---------- 背包按钮 ---------- */
#bag-btn {
  position: fixed;
  right: 26px; bottom: 22px;
  padding: 10px 20px;
  background: rgba(16, 16, 22, .92);
  border: 1px solid #3a3a46;
  border-radius: 4px;
  font-size: 14px;
  letter-spacing: 3px;
  color: #b9b9ae;
  cursor: pointer;
  z-index: 40;
  transition: border-color .2s;
}
#bag-btn:hover { border-color: #d8c78a; }
#bag-btn .key {
  font-size: 11px;
  color: #6a6a60;
  border: 1px solid #3a3a46;
  padding: 1px 6px;
  margin-left: 6px;
  border-radius: 3px;
}
#bag-count {
  position: absolute;
  top: -8px; left: -8px;
  min-width: 18px; height: 18px;
  border-radius: 9px;
  background: #d8c78a;
  color: #111;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}
#bag-count:empty { display: none; }
#bag-btn.pop { animation: pop .4s; }
@keyframes pop { 40% { transform: scale(1.12); } }

/* ---------- 背包面板 ---------- */
/* 行囊：场景右侧的常驻侧栏（不遮挡地图） */
#bag-panel {
  position: absolute;
  left: calc(100% + 14px);
  top: 51px;
  width: 300px;
  max-height: 504px;
  overflow-y: auto;
  background: rgba(10, 10, 14, .95);
  border: 1px solid #3a3a46;
  box-shadow: 0 0 60px rgba(0, 0, 0, .85);
  padding: 18px 16px 14px;
  opacity: 0;
  pointer-events: none;
  transform: translateX(10px);
  transition: opacity .2s, transform .2s;
}
#bag-panel.show { opacity: 1; pointer-events: auto; transform: none; }
#bag-title {
  text-align: center;
  font-size: 15px;
  letter-spacing: 8px;
  color: #d8c78a;
  margin-bottom: 14px;
}
#bag-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  min-height: 60px;
}
.bag-slot {
  height: 60px;
  border: 1px solid #2c2c38;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  color: #e8e2cc;
  cursor: pointer;
  position: relative;
  transition: border-color .15s, background .15s;
}
.bag-slot:hover { border-color: #d8c78a; background: rgba(216, 199, 138, .06); }
.bag-slot.held { border-color: #d8c78a; box-shadow: 0 0 12px rgba(216, 199, 138, .35) inset; }
.bag-slot.held::after {
  content: "手";
  position: absolute;
  right: 2px; top: 2px;
  font-size: 10px;
  color: #d8c78a;
}
#bag-empty {
  grid-column: 1 / -1;
  text-align: center;
  color: #4c4c46;
  font-size: 13px;
  letter-spacing: 4px;
  padding: 22px 0;
}
#bag-tip {
  margin-top: 16px;
  text-align: center;
  font-size: 12px;
  color: #55554e;
  letter-spacing: 2px;
}

/* ---------- 交互对话框 ---------- */
#dialog {
  position: fixed;
  display: none;
  z-index: 70;
  background: rgba(10, 10, 15, .97);
  border: 1px solid #4a4231;
  box-shadow: 0 0 40px rgba(0, 0, 0, .85), 0 0 18px rgba(216, 199, 138, .12);
  padding: 16px 18px;
  width: 168px;
}
#dlg-char {
  text-align: center;
  font-size: 40px;
  color: #ffe9a8;
  text-shadow: 0 0 16px rgba(255, 220, 140, .6);
  margin-bottom: 4px;
}
#dlg-sub {
  text-align: center;
  font-size: 11px;
  color: #6a6a60;
  letter-spacing: 2px;
  margin-bottom: 12px;
}
.dlg-btn {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 7px 10px;
  background: transparent;
  border: 1px solid #3a3a46;
  color: #d8d2bd;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  position: relative;
  text-align: center;
}
.dlg-btn:hover:not(:disabled) { border-color: #d8c78a; background: rgba(216, 199, 138, .08); }
.dlg-btn:disabled { color: #4c4c46; cursor: not-allowed; border-color: #26262e; }
.dlg-btn .key {
  position: absolute;
  right: 6px; top: 7px;
  font-size: 10px;
  color: #6a6a60;
  letter-spacing: 0;
}
.dlg-btn .why {
  display: block;
  font-size: 10px;
  letter-spacing: 1px;
  color: #55554e;
  margin-top: 3px;
}

/* ---------- 拆解全屏动画 ---------- */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(3, 3, 6, .92);
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s;
}
#overlay.show { opacity: 1; pointer-events: auto; }
#dis-stage { position: relative; height: 220px; display: flex; align-items: center; justify-content: center; }
#dis-big {
  font-size: 150px;
  color: #fff;
  text-shadow: 0 0 40px rgba(255, 255, 255, .55);
  transition: opacity .18s, transform .18s;
}
#dis-big.crack { opacity: 0; transform: scale(1.15); }
.dis-part {
  position: absolute;
  left: 50%; top: 50%;
  font-size: 92px;
  color: #ffe9a8;
  text-shadow: 0 0 26px rgba(255, 220, 140, .75);
  opacity: 0;
}
#dis-caption {
  position: absolute;
  bottom: 16%;
  width: 100%;
  text-align: center;
  font-size: 13px;
  letter-spacing: 6px;
  color: #6a6a60;
}

/* ---------- 飞行字符（拾取 / 拆解入包 / 合成 / 放下） ---------- */
.fly-char {
  position: fixed;
  z-index: 100;
  font-size: 26px;
  color: #ffe9a8;
  text-shadow: 0 0 14px rgba(255, 220, 140, .8);
  pointer-events: none;
  transform: translate(-50%, -50%);
}

/* ---------- 被火烧死 ---------- */
#death-overlay {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: radial-gradient(circle at 50% 56%, rgba(96, 14, 6, .94), rgba(4, 2, 2, .985) 70%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease;
}
#death-overlay.show { opacity: 1; pointer-events: auto; }
.death-fire {
  font-size: 120px;
  color: #ff4a2a;
  text-shadow: 0 0 44px rgba(255, 70, 30, .9);
  animation: fireGlow 1.2s ease-in-out infinite;
}
.death-text {
  font-size: 17px;
  letter-spacing: 4px;
  color: #c9c9c2;
}
.death-hint {
  font-size: 13px;
  letter-spacing: 3px;
  color: #8d8d80;
  margin-top: 6px;
}

/* ---------- 镜：地图上的镜子 ---------- */
.cell-char.mirror { color: #9fc3e0; animation: mirrorGlow 3s ease-in-out infinite; }
@keyframes mirrorGlow {
  0%, 100% { text-shadow: 0 0 8px rgba(150, 195, 235, .35); }
  50%      { text-shadow: 0 0 20px rgba(170, 210, 245, .75); }
}
.cell-char.mirror.mirror-fogged { color: #d3e9f4; animation: none; text-shadow: 0 0 18px rgba(205, 238, 255, .6); }
.cell-char.mirror.mirror-hot { color: #ffab84; animation: none; text-shadow: 0 0 22px rgba(255, 110, 60, .85); }

/* ---------- 镜的全屏界面 ---------- */
#mirror-overlay {
  position: fixed;
  inset: 0;
  z-index: 95;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 42%, rgba(26, 30, 38, .97), rgba(2, 3, 6, .99) 72%);
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s;
}
#mirror-overlay.show { opacity: 1; pointer-events: auto; }
#mirror-frame {
  position: relative;
  width: 250px; height: 310px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #4a4d58;
  border-radius: 2px;
  background: linear-gradient(158deg, rgba(180, 205, 228, .12), rgba(110, 122, 142, .03) 46%, rgba(180, 205, 228, .09));
  box-shadow: 0 0 60px rgba(140, 180, 220, .16) inset, 0 0 44px rgba(0, 0, 0, .75), 0 0 26px rgba(120, 165, 210, .12);
  overflow: hidden;
}
#mirror-frame::after {
  content: '';
  position: absolute;
  left: -45%; top: -20%;
  width: 38%; height: 140%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .10), transparent);
  transform: rotate(18deg);
  animation: mirrorSheen 5.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes mirrorSheen { 0%, 100% { left: -45%; } 50% { left: 110%; } }
#mirror-core {
  position: relative;
  z-index: 2;
  font-size: 116px;
  color: #dfeaf5;
  text-shadow: 0 0 34px rgba(175, 205, 238, .55);
  transition: color .25s, opacity .2s;
}
/* 螺旋漩涡：粒子画布盖在镜面上，背后再叠一层缓慢旋转的锥形光带 */
#mirror-vortex {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}
#mirror-frame::before {
  content: '';
  position: absolute;
  inset: -40%;
  background: conic-gradient(from 0deg,
    transparent 0deg,
    rgba(150, 195, 235, .13) 50deg,
    transparent 110deg,
    transparent 200deg,
    rgba(180, 215, 245, .09) 250deg,
    transparent 320deg);
  opacity: 0;
  transition: opacity .35s;
  animation: vortexSpin 2.4s linear infinite;
  pointer-events: none;
}
#mirror-frame.morphing::before { opacity: 1; }
@keyframes vortexSpin { to { transform: rotate(360deg); } }
#mirror-core.flashing { animation: mirrorFlash .62s ease-out; color: #fff; }
@keyframes mirrorFlash {
  0%   { text-shadow: 0 0 12px rgba(255, 255, 255, .45); transform: scale(1); }
  42%  { text-shadow: 0 0 60px #fff, 0 0 130px #cfe6ff; transform: scale(1.3); }
  100% { text-shadow: 0 0 34px rgba(185, 215, 245, .7); transform: scale(1); }
}
#mirror-core.mirror-shake { animation: mirrorShake .5s; }
@keyframes mirrorShake {
  18% { transform: translateX(-9px) rotate(-2deg); }
  38% { transform: translateX(8px) rotate(2deg); }
  58% { transform: translateX(-6px); }
  78% { transform: translateX(4px); }
}
#mirror-bag {
  position: fixed;
  left: 50%; bottom: 64px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 92vw;
  flex-wrap: wrap;
  justify-content: center;
  padding: 0 20px;
}
.mirror-slot {
  width: 60px; height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #e8e2cc;
  background: rgba(12, 13, 18, .7);
  border: 1px solid #3a3c46;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .15s, color .15s;
}
.mirror-slot:hover { border-color: #9fc4e8; color: #fff; box-shadow: 0 0 18px rgba(160, 200, 240, .35); transform: translateY(-3px); }
.mirror-slot.mirror-self { border-color: #7d6a30; color: #d8c78a; background: rgba(216, 199, 138, .07); }
.mirror-slot.mirror-self:hover { border-color: #d8c78a; color: #ffe9a8; box-shadow: 0 0 20px rgba(216, 199, 138, .45); }
.mirror-empty { color: #4c4c46; font-size: 13px; letter-spacing: 4px; width: 180px; text-align: center; }
#mirror-tip {
  position: fixed;
  left: 50%; bottom: 26px;
  transform: translateX(-50%);
  font-size: 12px;
  letter-spacing: 2px;
  color: #5d6470;
  white-space: nowrap;
}

/* ---------- 终章：门后的白 ---------- */
#ending-overlay {
  position: fixed;
  inset: 0;
  z-index: 210;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: #f4f1e8;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.6s ease;
}
#ending-overlay.show { opacity: 1; pointer-events: auto; }
#ending-title { font-size: 42px; letter-spacing: 20px; color: #3a362c; text-indent: 20px; opacity: 0; }
#ending-line1, #ending-line2, #ending-line3 { font-size: 16px; letter-spacing: 2px; color: #4a463c; opacity: 0; }
#ending-hint { margin-top: 28px; font-size: 12px; letter-spacing: 3px; color: #8d8674; opacity: 0; }
#ending-overlay.show #ending-title { animation: endingIn 2.2s ease .8s forwards; }
#ending-overlay.show #ending-line1 { animation: endingIn 2s ease 2.6s forwards; }
#ending-overlay.show #ending-line2 { animation: endingIn 2s ease 4.6s forwards; }
#ending-overlay.show #ending-line3 { animation: endingIn 2s ease 6.6s forwards; }
#ending-overlay.show #ending-hint { animation: endingIn 2s ease 8.8s forwards; }
@keyframes endingIn { to { opacity: 1; } }

/* ---------- 切关黑幕 ---------- */
#fade {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity .42s;
}
#fade.show { opacity: 1; pointer-events: auto; }
</style>
</head>

<script>
/* ============================================================
   一、常量
   ============================================================ */
const CELL = 56;
let COLS = 0, ROWS = 0;

/* ============================================================
   二、字的全局档案（配方表）
   地图里每一个汉字都按字符查这张表——所以配方天然是全局的。
   kind: scene 非交互场景字 / entity 可交互实体字
   ============================================================ */
const CHARS = {
  '墙': { kind: 'scene', solid: true,
         /* 手持“斧”撞墙：只崩下碎屑，没有任何结果 */
         combine: {
           '斧': { action: 'axeWall' },
         } },
  '草': { kind: 'scene', solid: false, grass: true },
  '树': { kind: 'scene', solid: true },

  '一': { kind: 'entity', solid: true, sub: '它在等你',
         pickable: true,
         dismantle: null, dismantleWhy: '独体字，拆无可拆' },
  '火': { kind: 'entity', solid: true, cls: 'fire', hot: true, sub: '它烧得正旺',
         pickable: false, pickableWhy: '火，拿不住',
         dismantle: null, dismantleWhy: '火，拆不开',
         combine: { '一': '灭', '木': { action: 'ignite' } } },
  '明': { kind: 'entity', solid: true, sub: '它沉在暗处',
         pickable: false, pickableWhy: '太大了，拿不动',
         dismantle: ['日', '月'] },

  '链': { kind: 'entity', solid: true, chain: true, sub: '它拴着你',
         pickable: false, pickableWhy: '钉死在墙上',
         dismantle: null, dismantleWhy: '徒手扯不开',
         combine: { '斧': { action: 'break', parts: ['钅', '辶', '车'], release: true,
                     narr: '“斧”落，“链”断——碎成了“钅”“辶”“车”，都进了行囊。你自由了。' } },
         /* 三部件不能一步拼回：先车+辶成“连”，再钅+连成“链” */
         assemble: [['钅', '连', '链']] },
  '连': { kind: 'entity', solid: true, sub: '“车”驮着“辶”',
         pickable: true,
         dismantle: ['车', '辶'] },
  '斧': { kind: 'entity', solid: true, sub: '它躺在地上',
         pickable: true,
         dismantle: ['父', '斤'] },
  '桌': { kind: 'entity', solid: true, sub: '它立在屋中',
         pickable: false, pickableWhy: '太大了，拿不动',
         dismantle: null, dismantleWhy: '徒手掰不散',
         combine: { '斧': { action: 'break', parts: ['占', '一', '木'],
                     narr: '“斧”落，“桌”散——劈成了“占”“一”“木”，都进了行囊。' } } },
  '石': { kind: 'entity', solid: true, sub: '它一声不吭',
         pickable: true,
         dismantle: null, dismantleWhy: '浑然一块，没有缝隙',
         strike: { with: '斧', hits: 3, spawn: '火' } },   // 斧击三下，石上生火

  /* 木：除了被“火”点燃，还能被“钻”钻出火来——另一条生火的路 */
  '木': { kind: 'entity', solid: true, sub: '一块木头，纹路还新',
         pickable: true,
         dismantle: null, dismantleWhy: '木，拆不开',
         combine: { '钻': { action: 'drillWood' } } },

  '冰': { kind: 'entity', solid: true, sub: '它冷得发白，边缘挂着水汽',
         pickable: false, pickableWhy: '冰，搬不动',
         dismantle: null, dismantleWhy: '冰，一拆就碎',
         combine: { '木': { action: 'melt' } } },
  '口': { kind: 'entity', solid: true, sub: '一个空空的“口”',
         pickable: true,
         dismantle: null, dismantleWhy: '口，拆不开' },
  '困': { kind: 'entity', solid: true, sub: '“木”被四面围住了',
         pickable: true,
         dismantle: ['木', '口'] },
  '听': { kind: 'entity', solid: true, sub: '它能听见墙里的动静',
         pickable: true,
         dismantle: ['口', '斤'] },
  '钻': { kind: 'entity', solid: true, sub: '锋利的钻头',
         pickable: true,
         dismantle: ['钅', '占'] },

  /* ---------- 镜室的字 ---------- */
  '镜': { kind: 'entity', solid: true, cls: 'mirror', mirror: true,
         sub: '一面镜子，照得出字的另一面',
         pickable: false, pickableWhy: '镜子，搬不动',
         dismantle: null, dismantleWhy: '镜子，拆不开' },

         pickable: true,
         dismantle: ['口', '一'] },
  '水': { kind: 'entity', solid: true, sub: '一捧水，捧得住',
         pickable: true,
         dismantle: null, dismantleWhy: '水，拆不开' },
  '关': { kind: 'entity', solid: true, sub: '关着的“关”',
         pickable: true,
         dismantle: null, dismantleWhy: '拆不开' },
  '开': { kind: 'entity', solid: true, sub: '开着的“开”',
         pickable: true,
         dismantle: null, dismantleWhy: '拆不开' },

  '门': { kind: 'entity', solid: true, cls: 'door', portal: true, sub: '门后是另一间屋子',
         pickable: false, pickableWhy: '门不是拿来拿的',
         dismantle: null, dismantleWhy: '门，拆不开' },
};

/* 由配方表推导“合体”配方：
   只收录能拼成真字的组合。多部件字通过中间字分步拼回
   （如 车+辶→连，钅+连→链），拼不成字的组合不会留下任何中间产物。 */
const ASSEMBLIES = [];
for (const [ch, def] of Object.entries(CHARS)) {
  if (Array.isArray(def.assemble)) {
    for (const [a, b, result] of def.assemble) {
      ASSEMBLIES.push({ parts: [a, b], sorted: [a, b].sort().join(''), result });
    }
    continue;   // 显式声明了分步路径，不再从劈开部件反推
  }
  const sets = [];
  if (Array.isArray(def.dismantle)) sets.push(def.dismantle);
  if (def.combine) {
    for (const k in def.combine) {
      const r = def.combine[k];
      if (r && r.action === 'break' && Array.isArray(r.parts)) sets.push(r.parts);
    }
  }
  for (const parts of sets) {
    if (parts.length !== 2) continue;   // 三件套没有两步合成路径，不提供逆向配方
    ASSEMBLIES.push({ parts, sorted: parts.slice().sort().join(''), result: ch });
  }
}

/* ============================================================

   ============================================================ */
const STEPS = [

            '再看左下方，地上躺着一个“一”。它不一样，它在等你。撞上去。'] },
  { key: 'openbag',   flag: 'opened',     objective: '按 F 打开行囊',
    enter: '“一”现在是你的了。按 F，行囊会在场景右侧展开——再按一次，就收起来。' },
  { key: 'hold',      flag: 'held',       objective: '点击“一”，把它拿在手上',
    enter: '这就是行囊，你拾起的一切都在这。点一下“一”，把它拿在手上——手里拿着什么，撞上字时，便会用上什么。' },
  { key: 'combine',   flag: 'combined',   objective: '手持“一”，撞向“火”',
    enter: '拿好了。右上方有一团“火”。拿着“一”，撞上去，别怕。' },
  { key: 'pass',      flag: 'passed',     objective: '穿过“灭”，走过去',
    enter: '“一”压住了“火”——火熄了，成了“灭”。字与字相撞，会生出新的字，这是这个世界的法则。而“灭”已经死了，死去的字拦不住你。走过去。' },
  { key: 'dismantle', flag: 'dismantled', objective: '撞向“明”，选择「拆解」',
    enter:['看见了吗，失去力量的字连阻拦你都做不到。',
	'下方还有一个“明”——它太大，拿不动，但“合体字”皆可拆。'] },
  { key: 'drop',      flag: 'dropped',    objective: '右键行囊里的“日”，把它放到地上',
    enter: '行囊里的字，对着它点右键，就能放到地上。现在来试试把“日”放下。' },
  { key: 'rejoin',    flag: 'rejoined',   objective: '手持“月”，撞向地上的“日”',
    enter: '拆得开，也拼得回。点一下行囊里的“月”，把它拿在手上，再去撞地上的“日”——部件相撞，会重新长回原来的字。' },
  { key: 'done',      flag: null,         objective: '撞向右墙的“门”，走进「空屋」',
    spawn: { char: '门', x: 12, y: 4 },

];

const LEVELS = [
  {
    short: '引导',
    title: '引 导',
    map: [

      '墙..草..明...草.墙',

  {

    ],

const NARR = {
  sceneFirst: '没有回应。场景的字只是站在那里——它们是这个世界的天与地，不与你交谈，也不为你让路。',

/* ============================================================
   四、运行时状态
   ============================================================ */
const state = {
  levelIndex: 0,
  level: null,
  player: { x: 0, y: 0, held: null, facing: { dx: 0, dy: 1 } },
  entities: new Map(),   // "x,y" -> entity
